[project]
name = "human"
version = "0.1.0"
description = "Compile a human abstraction into code and map both onto the real lines"
requires-python = ">=3.10"
dependencies = ["dmap @ file:///home/ubuntu/projects/human/decompile/cli"]

[project.scripts]
human = "human:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["human"]
