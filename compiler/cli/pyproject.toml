[project]
name = "human"
version = "2.0.1"
description = "One CLI for both directions: decompile code into a telling, or compile a human abstraction into code, with every word tied to real lines"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
human = "human:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["human", "decompiler", "cmd_map"]
