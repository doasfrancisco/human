[project]
name = "human"
version = "3.0.7"
description = "The human programming language: compile a free-text abstraction into code, or decompile code into a telling, with every word tied to real lines"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
human = "human:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["human"]

[tool.setuptools.package-data]
human = ["reader/*", "shapes/*", "skills/*/SKILL.md"]
