<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>Human · feed</title>
<style>
  :root{
    --bg:#161616; --card:#1d1d1d; --text:#f2f2f2; --muted:#8d8d8d; --faint:#565656; --line:#2a2a2a;
    --call:#e0a458; --pick:#2f6fed; --done:#2e9e5b;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior:none;}
  #top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;font-size:13px;color:var(--muted);background:linear-gradient(var(--bg) 70%,transparent);}
  #top select{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:13px;}
  #top .state{font-weight:700;letter-spacing:.08em;font-size:11px;padding:4px 10px;border-radius:999px;background:var(--line);}
  #top .state.done{background:var(--done);color:#fff;}
  #deck{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;}
  #deck::-webkit-scrollbar{display:none;}
  .row{height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;border-bottom:1px solid var(--line);}
  .strip{height:100%;display:flex;overflow-x:scroll;scroll-snap-type:x mandatory;scrollbar-width:none;}
  .strip::-webkit-scrollbar{display:none;}
  .card{flex:0 0 100vw;min-width:0;max-width:100vw;height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 52px) 20px calc(env(safe-area-inset-bottom) + 18px);}
  .head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline;font-size:13px;color:var(--muted);}
  .file{font-family:var(--mono);color:var(--text);font-size:14px;}
  .slot{font-weight:800;letter-spacing:.09em;font-size:11px;padding:4px 10px;border-radius:999px;background:var(--line);color:#fff;}
  .card.on .slot{background:var(--pick);}
  .dots{margin-left:auto;letter-spacing:.3em;color:var(--faint);}
  .dots b{color:var(--text);}
  .shape{font-size:11px;letter-spacing:.06em;color:var(--call);}
  .copy{font-size:11px;font-weight:700;letter-spacing:.08em;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;}
  .copy:hover{color:var(--text);}
  .vers{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11px;color:var(--muted);}
  .vers button{font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 9px;}
  .vers button.on{background:var(--pick);border-color:var(--pick);color:#fff;}
  .vers .at{margin-left:auto;color:var(--faint);}
  .body.old{border-style:dashed;color:var(--muted);}
  textarea{flex:1;min-width:0;font:inherit;font-size:13px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);resize:none;height:44px;}
  .why{font-size:13px;color:var(--text);font-style:italic;}
  .body{flex:1;min-height:0;overflow:auto;margin-top:14px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:12px;font-family:var(--mono);font-size:13px;line-height:1.62;white-space:pre-wrap;overflow-wrap:anywhere;}
  .body.empty{color:var(--faint);white-space:normal;font-family:var(--sans);}
  @media (max-width:600px){.body{font-size:11.5px;line-height:1.55;padding:12px;}}
  .anch{color:var(--call);border-bottom:1px dashed var(--call);}
  .foot{display:flex;align-items:center;gap:12px;margin-top:14px;min-height:44px;}
  button{font:inherit;font-weight:800;letter-spacing:.06em;font-size:14px;padding:11px 20px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;}
  button.pick{background:var(--pick);border-color:var(--pick);color:#fff;}
  button:disabled{opacity:.45;cursor:default;}
  .note{font-size:13px;color:var(--muted);}
  .hint{margin-left:auto;font-size:12px;letter-spacing:.14em;color:var(--faint);}
  .empty-deck{height:100dvh;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:20px;padding:24px;}
</style>
</head>
<body>
<div id="top"><span>session</span><select id="pickses"></select><span id="state" class="state"></span><span id="count"></span></div>
<div id="deck"></div>
<script>
var SLOTS=["best","refinement","free"], ANCH=/\[([^\[\]]+)\]\(([^()]+)\)/g;
var deck=document.getElementById("deck"), sel=document.getElementById("pickses");
var sessions=[], cur=null, sig={}, asking=null, viewing={};

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function versionOf(r,slot){
  var v=r.versions[slot];
  if(v===null) return null;
  if(typeof v==="string") return {text:v,shape:null,at:null,history:[]};
  return v;
}

function textsOf(v){
  return v.history.concat([{text:v.text,shape:v.shape,at:v.at}]);
}

function shownText(r,i,slot){
  var v=versionOf(r,slot);
  if(!v) return null;
  var all=textsOf(v), n=viewing[i+":"+slot];
  return all[n===undefined?all.length-1:Math.min(n,all.length-1)].text;
}

function textHtml(t){
  var out="", last=0, m;
  ANCH.lastIndex=0;
  while((m=ANCH.exec(t))){
    out+=esc(t.slice(last,m.index))+'<span class="anch">'+esc(m[1])+'</span>';
    last=m.index+m[0].length;
  }
  return out+esc(t.slice(last));
}

function wanted(){
  var q=new URLSearchParams(location.search).get("session");
  if(q&&sessions.some(function(s){return s.session_id===q;})) return q;
  var open=sessions.filter(function(s){return !s.finished;});
  return (open[0]||sessions[0]||{}).session_id||null;
}

function load(){
  return fetch("training/",{cache:"no-store"}).then(stored).then(function(list){
    sessions=list;
    var id=cur?cur.session_id:wanted();
    if(!id){cur=null;renderEmpty("no session yet — run human train --open");return;}
    if(!sessions.some(function(s){return s.session_id===id;})){cur=null;id=wanted();}
    return fetch("training/"+id+".json",{cache:"no-store"}).then(stored).then(function(d){
      cur=d;
      renderTop();
      renderRows();
    });
  }).catch(function(e){if(!cur)renderEmpty(typeof e==="string"?e:"could not load — run human serve at the project root");});
}

function stored(r){
  return r.json().then(function(j){return r.ok?j:Promise.reject(j.error||String(r.status));},
    function(){return Promise.reject("could not load — run human serve at the project root");});
}

function renderEmpty(t){
  deck.innerHTML='<div class="empty-deck">'+esc(t)+'</div>';
  sel.innerHTML=""; document.getElementById("state").textContent=""; document.getElementById("count").textContent="";
  sig={};
}

function renderTop(){
  var html=sessions.map(function(s){
    return '<option value="'+esc(s.session_id)+'"'+(s.session_id===cur.session_id?" selected":"")+'>'+esc(s.session_id)+(s.finished?" ✓":"")+'</option>';
  }).join("");
  if(sel.innerHTML!==html) sel.innerHTML=html;
  var st=document.getElementById("state");
  st.textContent=cur.finished?"FINISHED":"OPEN";
  st.className="state"+(cur.finished?" done":"");
  var picked=cur.rows.filter(function(r){return r.picked;}).length;
  document.getElementById("count").textContent=cur.rows.length+" files · "+picked+" picked";
}

function slotsOf(r){return r.kind==="sync"?SLOTS:["best","free"];}

function cardHtml(r,i,slot,k){
  var v=versionOf(r,slot), t=v?v.text:null, on=r.picked===slot;
  var dots=slotsOf(r).map(function(s,j){return j===k?"<b>●</b>":"●";}).join("");
  var label=slot;
  if(r.kind==="sync"&&slot==="refinement"&&t===r.before) label="current";
  var head='<div class="head"><span class="file">'+esc(r.file)+'</span><span>'+esc(r.kind)+' · '+esc(r.level)
    +(r.entry!==null?' · entry '+r.entry:"")+(r.block&&r.level==="above"?' · '+esc(r.block):"")
    +(r.carried_from?' · carried':"")
    +'</span><span class="slot">'+esc(label)+'</span>'
    +(v&&v.shape?'<span class="shape">'+esc(v.shape)+'</span>':"")
    +(t===null?"":'<button class="copy" data-copy="'+i+'" data-slot="'+slot+'">copy</button>')
    +'<span class="dots">'+dots+'</span></div>';
  var vers="", shown=t, old=false;
  if(v&&v.history.length){
    var all=textsOf(v), n=viewing[i+":"+slot];
    if(n===undefined||n>=all.length) n=all.length-1;
    shown=all[n].text; old=n<all.length-1;
    vers='<div class="vers"><span>rewrites</span>'+all.map(function(x,j){
      return '<button class="v'+(j===n?" on":"")+'" data-view="'+i+'" data-slot="'+slot+'" data-n="'+j+'">v'+(j+1)+'</button>';
    }).join("")+'<span class="at">'+(old?"earlier text":"latest — the pick takes this one")+(all[n].at?" · "+esc(all[n].at.slice(0,16).replace("T"," ")):"")+'</span></div>';
  }
  var body=t===null?'<div class="body empty">not written yet</div>':'<div class="body'+(old?" old":"")+'">'+textHtml(shown)+'</div>';
  var why=on&&r.comment?'<span class="why">“'+esc(r.comment)+'”</span>':"";
  var foot, hint='<span class="hint">◂ ▸ versions · ▾ next file</span>';
  if(cur.finished||r.applied)
    foot='<span class="note">'+(r.picked?(on?"picked":"picked: "+r.picked):"no pick")+(r.applied?" · entry "+r.applied.entry:"")+'</span>'+why+hint;
  else if(on)
    foot='<button data-row="'+i+'" data-slot="">picked ✓ — undo</button>'+why+hint;
  else if(asking&&asking.row===i&&asking.slot===slot)
    foot='<textarea placeholder="why this one? (optional)" maxlength="500">'+esc(asking.text)+'</textarea>'
      +'<button class="pick" data-row="'+i+'" data-slot="'+slot+'" data-save="1">pick</button>'
      +'<button data-cancel="1">cancel</button>';
  else
    foot='<button class="pick" data-row="'+i+'" data-slot="'+slot+'"'+(t===null?" disabled":"")+'>pick this one</button>'
      +(r.picked?'<span class="note">picked: '+esc(r.picked)+'</span>':"")+hint;
  return '<div class="card'+(on?" on":"")+'">'+head+vers+body+'<div class="foot">'+foot+'</div></div>';
}

function rerenderRow(i){
  var el=deck.querySelectorAll(".row")[i];
  if(!el) return;
  var strip=el.querySelector(".strip"), x=strip?strip.scrollLeft:0;
  el.innerHTML=rowHtml(cur.rows[i],i);
  el.querySelector(".strip").scrollLeft=x;
  sig[i]=JSON.stringify(cur.rows[i]);
}

function copyText(t,b){
  var done=function(){b.textContent="copied";setTimeout(function(){b.textContent="copy";},1200);};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done);return;}
  var ta=document.createElement("textarea");
  ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
  done();
}

function sendPick(row,slot,comment,b){
  b.disabled=true;
  fetch("training/"+cur.session_id+"/pick",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({row:row,picked:slot,comment:comment})})
    .then(function(r){return r.json().then(function(j){return r.ok?j:Promise.reject(j.error||r.status);});})
    .then(function(r){asking=null;cur.rows[row]=r;renderTop();rerenderRow(row);})
    .catch(function(e){b.disabled=false;alert("pick failed: "+e);});
}

function rowHtml(r,i){
  return '<div class="strip">'+slotsOf(r).map(function(s,k){return cardHtml(r,i,s,k);}).join("")+'</div>';
}

function renderRows(){
  if(!cur.rows.length){deck.innerHTML='<div class="empty-deck">session '+esc(cur.session_id)+' has no rows yet</div>';sig={};return;}
  var rows=deck.querySelectorAll(".row");
  if(rows.length!==cur.rows.length){
    deck.innerHTML=cur.rows.map(function(r,i){return '<section class="row" data-row="'+i+'">'+rowHtml(r,i)+'</section>';}).join("");
    sig={};
    cur.rows.forEach(function(r,i){sig[i]=JSON.stringify(r);});
    return;
  }
  cur.rows.forEach(function(r,i){
    var s=JSON.stringify(r);
    if(sig[i]===s) return;
    sig[i]=s;
    var el=rows[i], strip=el.querySelector(".strip"), x=strip?strip.scrollLeft:0;
    el.innerHTML=rowHtml(r,i);
    el.querySelector(".strip").scrollLeft=x;
  });
}

deck.addEventListener("click",function(ev){
  var b=ev.target.closest("button");
  if(!b||!cur) return;
  if(b.hasAttribute("data-copy")){
    var ci=+b.getAttribute("data-copy");
    copyText(shownText(cur.rows[ci],ci,b.getAttribute("data-slot")),b);
    return;
  }
  if(b.hasAttribute("data-view")){
    var vi=+b.getAttribute("data-view");
    viewing[vi+":"+b.getAttribute("data-slot")]=+b.getAttribute("data-n");
    rerenderRow(vi);
    return;
  }
  if(b.hasAttribute("data-cancel")){
    var was=asking; asking=null;
    if(was) rerenderRow(was.row);
    return;
  }
  if(!b.hasAttribute("data-row")) return;
  var row=+b.getAttribute("data-row"), slot=b.getAttribute("data-slot")||null;
  if(!slot){sendPick(row,null,null,b);return;}
  if(b.hasAttribute("data-save")){
    var ta=b.parentNode.querySelector("textarea");
    sendPick(row,slot,ta?ta.value.trim()||null:null,b);
    return;
  }
  var prev=asking; asking={row:row,slot:slot,text:""};
  if(prev&&prev.row!==row) rerenderRow(prev.row);
  rerenderRow(row);
  var f=deck.querySelectorAll(".row")[row].querySelector("textarea");
  if(f) f.focus();
});

deck.addEventListener("input",function(ev){
  if(asking&&ev.target.tagName==="TEXTAREA") asking.text=ev.target.value;
});

sel.addEventListener("change",function(){
  cur=null;
  history.replaceState(null,"","?session="+encodeURIComponent(sel.value));
  load();
});

load();
setInterval(load,5000);
</script>
</body>
</html>
