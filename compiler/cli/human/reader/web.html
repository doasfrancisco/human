<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Human</title>
<style>
  :root{
    --ground:#eef1f4; --surface:#fff; --surface-2:#f6f8fa; --ink:#151a22; --muted:#59636f;
    --faint:#8b95a1; --hair:#dde3e9; --spec:#0e7c86; --spec-wash:rgba(14,124,134,.11);
    --spec-wash-2:rgba(14,124,134,.05); --spec-line:rgba(14,124,134,.55); --call:#a15c00;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --ground:#0c0e13; --surface:#14181f; --surface-2:#191e27; --ink:#e7ebf1; --muted:#97a1af;
    --faint:#6c7684; --hair:#262d38; --spec:#3fd0dd; --spec-wash:rgba(63,208,221,.13);
    --spec-wash-2:rgba(63,208,221,.06); --spec-line:rgba(63,208,221,.55); --call:#e0a458; }}
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
  main{height:100%;display:flex;gap:10px;padding:14px;}
  #side{flex:0 0 240px;display:flex;flex-direction:column;gap:10px;min-height:0;}
  #wrap{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;}
  .pane{background:var(--surface);border:1px solid var(--hair);border-radius:10px;overflow:hidden;}
  #projbar{display:flex;align-items:center;gap:9px;padding:8px 14px;font-size:13px;flex-shrink:0;}
  .caret{color:var(--faint);font-size:15px;line-height:1;}
  #projname{font-family:var(--mono);color:var(--muted);flex:1;}
  #treewrap{flex:1;min-height:0;display:flex;flex-direction:column;}
  #tree{flex:1;min-height:0;}
  #newline{display:flex;align-items:center;gap:8px;padding:6px 14px;font-family:var(--mono);font-size:12px;border-bottom:1px solid var(--hair);flex-shrink:0;}
  #newfile{color:var(--spec);cursor:pointer;white-space:nowrap;}
  #newfile:hover{text-decoration:underline;}
  #newname{flex:1;min-width:0;font:inherit;font-size:12px;padding:2px 6px;border:1px solid var(--hair);border-radius:6px;background:var(--surface);color:var(--ink);}
  #newname[hidden]{display:none;}
  #reader{flex:1;min-height:0;display:flex;flex-direction:column;}
  .phead{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--hair);padding:5px 14px;flex-shrink:0;}
  #head{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #menu{display:none;cursor:pointer;color:var(--faint);font-size:15px;line-height:1;padding:2px 4px;}
  .rows{flex:1;min-height:0;overflow:auto;padding:6px 0;display:grid;grid-auto-rows:min-content;align-content:start;}
  .bhead{font-family:var(--mono);font-size:11px;color:var(--muted);padding:10px 14px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .12s;}
  .bhead.closable{cursor:pointer;}
  .bhead.closable:hover{color:var(--spec);}
  .pill{font-family:var(--mono);font-size:11px;color:var(--faint);padding:6px 14px;}
  .chunk{font-family:var(--mono);font-size:13px;line-height:1.62;white-space:pre;padding:2px 14px;}
  .anch{color:var(--call);border-bottom:1px dashed var(--call);cursor:pointer;transition:color .12s;}
  .anch:hover{color:var(--spec);border-bottom-color:var(--spec);}
  .anch.off{color:var(--muted);border-bottom:1px dotted var(--faint);cursor:default;}
  .entry{transition:background .5s;}
  .entry.folded .body{display:none;}
  .entry.flash{background:var(--spec-wash);}
  .anch.flash{background:var(--spec-wash);color:var(--spec);}
  .bhead .caret{font-size:11px;}
  #msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;}
  #msg[hidden]{display:none;}
  #readwrap{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;}
  #shade{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.4);}
  .bhead{display:flex;align-items:center;gap:6px;}
  .bhead .label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;}
  .queued{color:var(--spec);}
  .chunk.plain,.chunk.blank{cursor:text;}
  .chunk.blank{color:var(--faint);padding:6px 14px 14px;transition:color .12s,background .12s;}
  .chunk.blank:hover{color:var(--ink);background:var(--spec-wash-2);}
  .chunk textarea{display:block;width:100%;font:inherit;line-height:inherit;white-space:pre;overflow-wrap:normal;overflow-x:auto;overflow-y:hidden;background:transparent;color:var(--ink);border:0;outline:0;padding:0;margin:0;resize:none;tab-size:4;}
  .pill.note{white-space:pre-wrap;}
  .pill.bad{color:var(--call);}
  #state{color:var(--faint);}
  #go{color:var(--spec);border:1px solid var(--spec-line);border-radius:999px;padding:1px 9px;cursor:pointer;}
  #go[hidden]{display:none;}
  #go.busy{opacity:.5;cursor:default;}
  #tchip{color:var(--spec);cursor:pointer;white-space:nowrap;}
  #tchip.off{color:var(--faint);cursor:default;}
  #tchip[hidden]{display:none;}
  #train{position:fixed;inset:0;z-index:12;display:flex;flex-direction:column;background:var(--ground);color:var(--ink);}
  #train[hidden]{display:none;}
  #ttop{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--hair);flex-shrink:0;}
  #ttop select{background:var(--surface);color:var(--ink);border:1px solid var(--hair);border-radius:8px;padding:4px 8px;font-size:13px;}
  #ttop .state{font-weight:700;letter-spacing:.08em;font-size:11px;padding:4px 10px;border-radius:999px;background:var(--hair);}
  #ttop .state.done{background:#2e9e5b;color:#fff;}
  #ttop .gap{flex:1;}
  #ttop .tb{font:inherit;font-size:12px;font-weight:700;letter-spacing:.06em;padding:5px 12px;border-radius:999px;border:1px solid var(--hair);background:var(--surface);color:var(--ink);cursor:pointer;}
  #ttop .tb.go{border-color:var(--spec-line);color:var(--spec);}
  #ttop .tb:disabled{opacity:.45;cursor:default;}
  #tnote{font-size:12px;color:var(--muted);padding:6px 16px;white-space:pre-wrap;border-bottom:1px solid var(--hair);flex-shrink:0;}
  #tnote[hidden]{display:none;}
  #tnote.bad{color:var(--call);}
  #deck{flex:1;min-height:0;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;}
  #deck::-webkit-scrollbar{display:none;}
  #deck .row{height:100%;scroll-snap-align:start;scroll-snap-stop:always;border-bottom:1px solid var(--hair);}
  #deck .strip{height:100%;display:flex;overflow-x:scroll;scroll-snap-type:x mandatory;scrollbar-width:none;}
  #deck .strip::-webkit-scrollbar{display:none;}
  #deck .card{flex:0 0 100%;min-width:0;max-width:100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;padding:16px 20px calc(env(safe-area-inset-bottom) + 18px);}
  #deck .head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline;font-size:13px;color:var(--muted);}
  #deck .file{font-family:var(--mono);color:var(--ink);font-size:14px;}
  #deck .slot{font-weight:800;letter-spacing:.09em;font-size:11px;padding:4px 10px;border-radius:999px;background:var(--hair);color:var(--ink);}
  #deck .card.on .slot{background:var(--spec);color:#fff;}
  #deck .dots{margin-left:auto;letter-spacing:.3em;color:var(--faint);}
  #deck .dots b{color:var(--ink);}
  #deck .shape{font-size:11px;letter-spacing:.06em;color:var(--call);}
  #deck .copy{font-size:11px;font-weight:700;letter-spacing:.08em;padding:4px 10px;border-radius:999px;border:1px solid var(--hair);background:transparent;color:var(--muted);cursor:pointer;}
  #deck .copy:hover{color:var(--ink);}
  #deck .vers{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11px;color:var(--muted);}
  #deck .vers button{font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 9px;}
  #deck .vers button.on{background:var(--spec);border-color:var(--spec);color:#fff;}
  #deck .vers .at{margin-left:auto;color:var(--faint);}
  #deck .body{flex:1;min-height:0;overflow:auto;margin-top:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--hair);border-radius:12px;font-family:var(--mono);font-size:13px;line-height:1.62;white-space:pre-wrap;overflow-wrap:anywhere;}
  #deck .body.old{border-style:dashed;color:var(--muted);}
  #deck .body.empty{color:var(--faint);white-space:normal;font-family:var(--sans);}
  #deck .anch{cursor:default;}
  #deck .anch:hover{color:var(--call);border-bottom-color:var(--call);}
  #deck textarea{flex:1;min-width:0;font:inherit;font-size:13px;padding:10px 12px;border-radius:12px;border:1px solid var(--hair);background:var(--surface);color:var(--ink);resize:none;height:44px;}
  #deck .why{font-size:13px;color:var(--ink);font-style:italic;}
  #deck .foot{display:flex;align-items:center;gap:12px;margin-top:14px;min-height:44px;}
  #deck button{font:inherit;font-weight:800;letter-spacing:.06em;font-size:14px;padding:11px 20px;border-radius:999px;border:1px solid var(--hair);background:var(--surface);color:var(--ink);cursor:pointer;}
  #deck button.pick{background:var(--spec);border-color:var(--spec);color:#fff;}
  #deck button:disabled{opacity:.45;cursor:default;}
  #deck .note{font-size:13px;color:var(--muted);}
  #deck .hint{margin-left:auto;font-size:12px;letter-spacing:.14em;color:var(--faint);}
  #deck .empty-deck{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:20px;padding:24px;}
  @media (max-width:600px){#deck .body{font-size:11.5px;line-height:1.55;padding:12px;}}
  .bhead .act{color:var(--spec);cursor:pointer;flex:none;}
  .bhead .act:hover{text-decoration:underline;}
  .bhead .act.quiet{color:var(--faint);margin-left:auto;}
  #ctx{position:fixed;z-index:30;background:var(--surface);border:1px solid var(--hair);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.18);font-family:var(--mono);font-size:12px;padding:4px;min-width:170px;}
  #ctx[hidden]{display:none;}
  #ctx div{padding:5px 10px;border-radius:5px;cursor:pointer;white-space:nowrap;}
  #ctx div:hover{background:var(--spec-wash);color:var(--spec);}
  @media (max-width:720px){
    main{padding:8px;gap:8px;}
    #menu{display:inline-block;}
    #side{position:fixed;top:0;bottom:0;left:0;width:min(78vw,300px);z-index:20;background:var(--ground);padding:8px;transform:translateX(-105%);transition:transform .2s;box-shadow:2px 0 12px rgba(0,0,0,.25);}
    #side.open{transform:none;}
    .chunk{font-size:12px;line-height:1.55;padding:2px 10px;}
    .bhead,.phead{padding-left:10px;padding-right:10px;}
    .pill{padding:6px 10px;}
  }
</style>
</head>
<body>
<main>
  <div id="side">
    <section class="pane" id="projbar"><span id="projname"></span></section>
    <section class="pane" id="treewrap"><div id="newline"><span id="newfile">new file</span><input id="newname" hidden spellcheck="false" placeholder="src/app.py"></div><div id="tree"></div></section>
  </div>
  <div id="wrap">
    <div id="readwrap">
      <section class="pane" id="reader"><div class="phead"><span id="menu">☰</span><span id="head"></span><span id="tchip" hidden></span><span id="state"></span><span id="go" hidden>compile</span></div><div class="rows" id="rows"></div></section>
      <div id="msg" hidden></div>
    </div>
  </div>
</main>
<div id="shade" hidden></div>
<div id="ctx" hidden></div>
<div id="train" hidden>
  <div id="ttop"><span>training</span><select id="tsel"></select><span id="tstate" class="state"></span><span id="tcount"></span><span class="gap"></span><span id="tclose"></span><button class="tb" id="thide">hide</button></div>
  <div id="tnote" hidden></div>
  <div id="deck"></div>
</div>
<script type="module">
import { FileTree } from "./trees.js";

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
var ANCH=/\[([^\[\]]+)\]\(([^()]+)\)/g;
var projs=[], cur=null, byId={}, blockId={}, order=[], lines=[], ft=null, openSet={}, openMem={}, notice="";
var editing=null, typed={}, pendingBy={}, sending=false, bad=false, caretWanted=0, expanding=null, deleting=null;
var rows=document.getElementById("rows");

function msg(t){var el=document.getElementById("msg");el.hidden=!t;el.textContent=t||"";}

var side=document.getElementById("side"), shade=document.getElementById("shade");
function drawer(on){side.classList.toggle("open",on);shade.hidden=!on;}
document.getElementById("menu").addEventListener("click",function(){drawer(!side.classList.contains("open"));});
shade.addEventListener("click",function(){drawer(false);});

function loadFile(f){
  return fetch("explanation_"+f.replace(/\//g,"__")+".json",{cache:"no-store"})
    .then(function(r){return r.ok?r.json():null;})
    .catch(function(){return null;})
    .then(function(d){
      if(!d||!Array.isArray(d.explanations))
        d={explanations:[],not_covered:{code_lines:[],blank_lines:[]}};
      return {file:f,d:d,code:null};
    });
}

fetch("human.json",{cache:"no-store"}).then(function(r){return r.json();}).then(function(h){
  if(h.code_file) document.title="Human · "+h.code_file;
  var names=h.files||[];
  return Promise.all(names.map(loadFile)).then(function(fs){
    return fetch("project.json",{cache:"no-store"})
      .then(function(r){return r.ok?r.json():null;})
      .catch(function(){return null;})
      .then(function(pj){
        if(pj&&Array.isArray(pj.explanations)) fs.unshift({file:"human/project.json",d:pj,code:null});
        fs.unshift({file:"human/human.json",d:h,code:null});
        return fs.length?{name:h.code_file||"project",files:fs}:null;
      });
  });
}).then(function(p){
  if(!p){msg("no files — run human init at the project root");return;}
  projs=[p];
  var start=p.files[0];
  buildTree(p,start.file);
  open(p,start);
}).catch(function(){msg("could not load — run human serve at the project root");});

function buildTree(p,sel){
  var box=document.getElementById("tree");
  if(ft&&ft.cleanUp) ft.cleanUp();
  box.innerHTML="";
  var ex=[], acc="";
  sel.split("/").slice(0,-1).forEach(function(d){acc=acc?acc+"/"+d:d;ex.push(acc);});
  ft=new FileTree({paths:p.files.map(function(f){return f.file;}),initialExpansion:"closed",
    initialExpandedPaths:ex,
    initialSelectedPaths:[sel],
    onSelectionChange:function(){
      if(!cur) return;
      var s=ft.getSelectedPaths()[0];
      if(!s||s===cur.file) return;
      var f=fileOf(s);
      if(f) open(cur.proj,f);
    }});
  ft.render({fileTreeContainer:box});
}

var refreshing=null;
function refreshFiles(){
  if(!cur) return Promise.resolve(false);
  if(refreshing) return refreshing;
  var p=cur.proj;
  refreshing=fetch("human.json",{cache:"no-store"}).then(function(r){return r.json();}).then(function(h){
    var names=h.files||[], have={};
    p.files.forEach(function(f){have[f.file]=f;});
    var old=p.files.filter(function(f){return f.file.indexOf("human/")!==0;}).map(function(f){return f.file;});
    if(JSON.stringify(old)===JSON.stringify(names)) return false;
    return Promise.all(names.map(function(n){return have[n]?Promise.resolve(have[n]):loadFile(n);})).then(function(fs){
      p.files=p.files.filter(function(f){return f.file.indexOf("human/")===0;}).concat(fs);
      var still=fileOf(cur.file);
      buildTree(p,still?cur.file:p.files[0].file);
      if(!still) open(p,p.files[0]);
      return true;
    });
  }).catch(function(){return false;}).then(function(x){refreshing=null;return x;});
  return refreshing;
}
setInterval(refreshFiles,5000);

function makeFile(name){
  if(!cur||sending) return;
  sending=true; bad=false; notice="making "+name+"…";
  render();
  fetch("file",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:name})})
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
    .then(function(x){
      sending=false;
      if(!x.ok){notice=x.j.error||"refused";bad=true;render();return;}
      newClose();
      refreshFiles().then(function(){
        var f=fileOf(x.j.name);
        if(f){open(cur.proj,f);buildTree(cur.proj,f.file);}
        notice=x.j.output; render();
      });
    })
    .catch(function(){sending=false;notice="the server did not answer — is human serve running?";bad=true;render();});
}

var newName=document.getElementById("newname");
function newClose(){newName.hidden=true;newName.value="";}
document.getElementById("newfile").addEventListener("click",function(){
  if(newName.hidden){newName.hidden=false;newName.focus();}else newClose();
});
newName.addEventListener("keydown",function(ev){
  if(ev.key==="Escape"){newClose();return;}
  if(ev.key==="Enter"){ev.preventDefault();var n=newName.value.trim();if(n) makeFile(n);}
});

function open(p,f){
  cur={proj:p,name:p.name,file:f.file,d:f.d,code:f.code};
  document.getElementById("projname").textContent=p.name;
  lines=f.code?f.code.replace(/\n$/,"").split("\n"):[];
  openSet=openMem[p.name+"/"+f.file]=openMem[p.name+"/"+f.file]||{};
  byId={}; blockId={}; notice="";
  if(editing&&editing.file!==f.file) editing=null;
  f.d.explanations.forEach(function(e){
    byId[e.id]=e;
    if(!(e.block in blockId)) blockId[e.block]=e.id;
  });
  order=sorted(f.d.explanations);
  msg("");
  drawer(false);
  render();
  if(f.code===null&&!f.d.explanations.length) loadCode(p,f);
}

function loadCode(p,f){
  fetch("../"+f.file,{cache:"no-store"})
    .then(function(r){return r.ok?r.text():null;})
    .then(function(t){
      f.code=t===null?"":t;
      if(!cur||cur.proj!==p||cur.file!==f.file) return;
      cur.code=f.code;
      lines=f.code?f.code.replace(/\n$/,"").split("\n"):[];
      render();
    })
    .catch(function(){});
}

function fileOf(name){
  var f=null;
  if(cur) cur.proj.files.forEach(function(x){if(x.file===name)f=x;});
  return f;
}

function crossEntry(fname,bname){
  var f=fileOf(fname), has=false;
  if(f) f.d.explanations.forEach(function(e){if(e.block===bname)has=true;});
  return has;
}

function crossAnchor(fname,eid,words){
  var f=fileOf(fname), has=false;
  if(f) f.d.explanations.forEach(function(e){
    if(e.id===eid) (e.anchors||[]).forEach(function(a){if(a.words===words)has=true;});
  });
  return has;
}

function targetOf(a){
  if(a.file) return null;
  if(a.explanation) return byId[a.explanation]?a.explanation:null;
  var t=blockId[a.block];
  return t===undefined?null:t;
}

function sorted(es){
  var depth={}, refs={};
  es.forEach(function(e){
    depth[e.id]=0;
    (e.anchors||[]).forEach(function(a){
      var t=targetOf(a);
      if(t&&t!==e.id){refs[t]=refs[t]||[];refs[t].push(e.id);}
    });
  });
  for(var k=0;k<es.length;k++){
    var moved=false;
    es.forEach(function(e){
      (refs[e.id]||[]).forEach(function(r){
        if(depth[r]+1>depth[e.id]){depth[e.id]=depth[r]+1;moved=true;}
      });
    });
    if(!moved) break;
  }
  return es.slice().sort(function(x,y){
    return depth[y.id]-depth[x.id]||startOf(x)-startOf(y)||x.id-y.id;
  });
}

function anchorByWords(e,w){
  var found=null;
  (e.anchors||[]).forEach(function(a){if(a.words===w)found=a;});
  return found;
}

function guessAnchor(t){
  t=t.trim();
  var em=/^e(\d+):(.+)$/.exec(t);
  if(em) return {explanation:+em[1],anchor:em[2]};
  if(t in blockId) return {block:t};
  var i=t.indexOf(":"), fn=i<0?t:t.slice(0,i), rest=i<0?null:t.slice(i+1);
  if(!fileOf(fn)) return null;
  if(rest===null) return {file:fn};
  var fe=/^e(\d+):(.+)$/.exec(rest);
  return fe?{file:fn,entry:+fe[1],anchor:fe[2]}:{file:fn,block:rest};
}

function startOf(e){return Math.min.apply(null,e.block_lines.map(function(r){return r[0];}));}

function fmtSpans(e){
  return e.block_lines.map(function(r){return r[0]===r[1]?String(r[0]):r[0]+"–"+r[1];}).join(", ");
}

function pinOf(e,m){return anchorByWords(e,m[1].trim())||guessAnchor(m[2]);}

function suffixOf(a){
  if(!a||!a.file) return "";
  if(a.entry) return crossAnchor(a.file,a.entry,a.anchor)?"":" ("+a.file+":e"+a.entry+")";
  return fileOf(a.file)&&(!a.block||crossEntry(a.file,a.block))?"":a.block?" ("+a.block+")":"";
}

function lineHtml(e,l){
  var out="", last=0, m;
  ANCH.lastIndex=0;
  while((m=ANCH.exec(l))){
    out+=esc(l.slice(last,m.index));
    var a=pinOf(e,m);
    if(a&&a.file&&a.entry){
      if(crossAnchor(a.file,a.entry,a.anchor))
        out+='<span class="anch" data-file="'+esc(a.file)+'" data-entry="'+a.entry+'" data-words="'+esc(a.anchor)+'">'+esc(m[1])+'</span>';
      else
        out+='<span class="anch off">'+esc(m[1]+suffixOf(a))+'</span>';
      last=m.index+m[0].length;
      continue;
    }
    if(a&&a.file){
      if(fileOf(a.file)&&(!a.block||crossEntry(a.file,a.block)))
        out+='<span class="anch" data-file="'+esc(a.file)+'"'
          +(a.block?' data-block="'+esc(a.block)+'"':'')+'>'+esc(m[1])+'</span>';
      else
        out+='<span class="anch off">'+esc(m[1]+suffixOf(a))+'</span>';
      last=m.index+m[0].length;
      continue;
    }
    var t=a?targetOf(a):null;
    if(t&&t!==e.id)
      out+='<span class="anch" data-kind="'+(a.explanation?"swap":"zoom")+'" data-child="'+t+'">'+esc(m[1])+'</span>';
    else
      out+='<span class="anch off">'+esc(m[1])+'</span>';
    last=m.index+m[0].length;
  }
  out+=esc(l.slice(last));
  return out;
}

function nameOf(file){
  if(file==="human/project.json") return "project";
  if(file==="human/human.json") return null;
  return file;
}

function key(file,kind,id){return "human-draft:"+cur.name+"/"+file+"/"+(id===null?kind:id);}

function baseText(kind,id){return kind==="retext"?byId[id].text:kind==="code"?(cur.code||""):"";}

function expandHere(){return !!expanding&&!!cur&&expanding.file===cur.file;}
function deleteHere(){return !!deleting&&!!cur&&deleting.file===cur.file;}

function shownText(kind,id){
  var k=key(cur.file,kind,id);
  if(k in typed) return typed[k];
  var s=localStorage.getItem(k);
  return s!==null?s:baseText(kind,id);
}

function changed(kind,id){return shownText(kind,id)!==baseText(kind,id);}

function unsaved(kind,id){
  var k=key(cur.file,kind,id);
  if(!(k in typed)) return false;
  var s=localStorage.getItem(k);
  return typed[k]!==(s!==null?s:baseText(kind,id));
}

function slots(){
  var name=nameOf(cur.file);
  if(!name) return [];
  if(!cur.d.explanations.length){
    var s=[{kind:"map",id:null}];
    if(name!=="project"&&cur.code!==null) s.push({kind:"code",id:null});
    return s;
  }
  return order.map(function(e){return {kind:"retext",id:e.id};});
}

function queuedMark(name,id){
  var q=(pendingBy[name]||[]).filter(function(x){return id===undefined||x.entry===id;});
  return q.length?' <span class="queued">· compiling'+(q.length>1?" ×"+q.length:"")+'</span>':"";
}

function isEditing(kind,id){return !!editing&&editing.kind===kind&&editing.id===id;}

function editorHtml(text,kind,id){
  return '<div class="chunk edit"><textarea spellcheck="false" data-slot="'+esc(key(cur.file,kind,id))+'">'+esc(text)+'</textarea></div>';
}

function mapSlotHtml(name){
  var t=shownText("map",null), html="";
  if(!t&&!isEditing("map",null)) return '<div class="chunk blank" data-edit="map">new abstraction</div>';
  html+='<div class="bhead">'+(name==="project"||!(cur.code||"").trim()?'<span class="label">new abstraction</span>'
    :'<span class="label act" data-act="decompile">decompile '+esc(cur.file)+'</span>')+'</div>';
  if(isEditing("map",null)) return html+editorHtml(t,"map",null);
  return html+'<div class="chunk plain" data-edit="map">'+t.split("\n").map(function(l){return lineHtml({id:null,anchors:[]},l);}).join("\n")+'</div>';
}

function expandSlotHtml(name){
  var t=shownText("expand",null);
  var html='<div class="bhead"><span class="label act" data-act="expand">expand on abstraction '+expanding.entry+'</span>'
    +'<span class="act quiet" data-act="unexpand">cancel</span></div>';
  if(isEditing("expand",null)) return html+editorHtml(t,"expand",null);
  if(!t) return html+'<div class="chunk blank" data-edit="expand">your words, or none</div>';
  return html+'<div class="chunk plain" data-edit="expand">'+t.split("\n").map(function(l){return lineHtml({id:null,anchors:[]},l);}).join("\n")+'</div>';
}

function codeSlotHtml(){
  var t=shownText("code",null);
  if(isEditing("code",null)) return editorHtml(t,"code",null);
  var ls=t?t.replace(/\n$/,"").split("\n"):[];
  if(!ls.length) return "";
  var pad=String(ls.length).length;
  return '<div class="chunk plain" data-edit="code">'+esc(ls.map(function(l,i){return String(i+1).padStart(pad)+"  "+l;}).join("\n"))+'</div>';
}

function header(){
  var any=false, dirty=false;
  slots().forEach(function(s){
    if(changed(s.kind,s.id)) any=true;
    if(unsaved(s.kind,s.id)) dirty=true;
  });
  document.getElementById("state").textContent=dirty?"unsaved":"";
  var go=document.getElementById("go");
  go.hidden=!any&&!sending;
  go.classList.toggle("busy",sending);
}

function render(){
  keepBox();
  var name=nameOf(cur.file);
  var html=notice?'<div class="pill note'+(bad?" bad":"")+'">'+esc(notice)+'</div>':"";
  if(!cur.d.explanations.length){
    var word=cur.code===null?"loading the file":"no abstraction for this file yet";
    if(name&&cur.code!==null){
      html+=mapSlotHtml(name);
      if(name!=="project") html+=codeSlotHtml();
    }else if(lines.length){
      var pad=String(lines.length).length;
      html+='<div class="chunk">'+esc(lines.map(function(l,i){return String(i+1).padStart(pad)+"  "+l;}).join("\n"))+'</div>';
    }
    var top0=rows.scrollTop;
    rows.innerHTML=html;
    document.getElementById("head").innerHTML=esc(cur.name+"/"+cur.file+"  ·  "+word)+(name?queuedMark(name):"");
    header(); focusEditor();
    rows.scrollTop=top0;
    return;
  }
  var opened=0;
  if(name&&expandHere()) html+=expandSlotHtml(name);
  order.forEach(function(e){
    var on=!!openSet[e.id]||isEditing("retext",e.id);
    if(on) opened++;
    var spans=fmtSpans(e);
    html+='<div class="entry'+(on?'':' folded')+'" data-entry="'+e.id+'">'
      +(deleteHere()&&deleting.entry===e.id
        ?'<div class="bhead"><span class="label act" data-act="delete">delete abstraction '+e.id+'</span><span class="act quiet" data-act="undelete">cancel</span></div>'
        :'<div class="bhead closable" data-fold="'+e.id+'"><span class="caret">'+(on?'▾':'▸')+'</span><span class="label">'
          +esc(e.block)+(spans?' · '+spans:"")+queuedMark(name,e.id)+'</span></div>')
      +'<div class="body">'+(isEditing("retext",e.id)?editorHtml(shownText("retext",e.id),"retext",e.id)
        :'<div class="chunk'+(name?' plain" data-edit="retext" data-id="'+e.id:'')+'">'
          +shownText("retext",e.id).split("\n").map(function(l){return lineHtml(e,l);}).join("\n")+'</div>')
      +'</div></div>';
  });
  var bare=(cur.d.not_covered&&cur.d.not_covered.code_lines||[]).length;
  if(bare) html+='<div class="pill">▹ '+bare+' bare lines</div>';
  var top=rows.scrollTop;
  rows.innerHTML=html;
  document.getElementById("head").textContent=
    cur.name+"/"+cur.file+"  ·  "+opened+"/"+cur.d.explanations.length+" open";
  header(); focusEditor();
  rows.scrollTop=top;
}

function fit(ta){var top=rows.scrollTop;ta.style.height="auto";ta.style.height=ta.scrollHeight+"px";rows.scrollTop=top;}

function focusEditor(){
  var ta=rows.querySelector(".chunk textarea");
  if(!ta) return;
  fit(ta);
  ta.focus({preventScroll:true});
  var pos=Math.min(caretWanted,ta.value.length);
  ta.setSelectionRange(pos,pos);
}

function keep(text){
  var k=key(editing.file,editing.kind,editing.id);
  if(text!==shownText(editing.kind,editing.id)||k in typed) typed[k]=text;
}

function keepBox(){
  var ta=rows.querySelector(".chunk textarea");
  if(!editing||!ta||ta.getAttribute("data-slot")!==key(editing.file,editing.kind,editing.id)) return;
  keep(ta.value);
}

function caretAt(ev,el){
  var node=null, off=0;
  if(document.caretPositionFromPoint){
    var p=document.caretPositionFromPoint(ev.clientX,ev.clientY);
    if(p){node=p.offsetNode;off=p.offset;}
  }else if(document.caretRangeFromPoint){
    var c=document.caretRangeFromPoint(ev.clientX,ev.clientY);
    if(c){node=c.startContainer;off=c.startOffset;}
  }
  if(!node||!el.contains(node)) return 0;
  var r=document.createRange();
  r.setStart(el,0); r.setEnd(node,off);
  return r.toString().length;
}

function rawOffset(text,shown,e){
  var seen=0, last=0, m;
  ANCH.lastIndex=0;
  while((m=ANCH.exec(text))){
    var plain=m.index-last;
    if(seen+plain>=shown) return last+(shown-seen);
    seen+=plain;
    if(seen+m[1].length>=shown) return m.index+1+(shown-seen);
    seen+=m[1].length;
    var suf=suffixOf(pinOf(e,m)).length;
    if(seen+suf>=shown) return m.index+m[0].length;
    seen+=suf;
    last=m.index+m[0].length;
  }
  return Math.min(text.length,last+(shown-seen));
}

function codeOffset(text,shown){
  var ls=text.replace(/\n$/,"").split("\n"), pad=String(ls.length).length+2, at=0;
  for(var i=0;i<ls.length;i++){
    var w=pad+ls[i].length+1;
    if(shown<w) return at+Math.max(0,shown-pad);
    shown-=w; at+=ls[i].length+1;
  }
  return text.length;
}

function startEdit(kind,id,ev,el){
  var text=shownText(kind,id), at=caretAt(ev,el);
  caretWanted=kind==="code"?codeOffset(text,at):rawOffset(text,at,kind==="retext"?byId[id]:{id:null,anchors:[]});
  editing={file:cur.file,kind:kind,id:id};
  render();
}

function leaveEdit(text){
  if(!editing) return;
  keep(text);
  editing=null;
  caretWanted=0;
  render();
}

function save(){
  if(!cur) return;
  keepBox();
  slots().forEach(function(s){
    var k=key(cur.file,s.kind,s.id);
    if(!(k in typed)) return;
    if(typed[k]===baseText(s.kind,s.id)) localStorage.removeItem(k); else localStorage.setItem(k,typed[k]);
    delete typed[k];
  });
  header();
}

function post(body){
  return fetch("compile",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});});
}

function ask(body,after){
  if(!cur||sending) return;
  var f=fileOf(cur.file), file=cur.file;
  sending=true; bad=false; notice="compiling…";
  render();
  post(body).then(function(x){
    sending=false;
    if(!x.ok){notice=x.j.error||"refused";bad=true;render();return;}
    if(after) after();
    var said=x.j.output+(x.j.seq?"  ·  event "+x.j.seq+" waits for claude":"");
    var show=function(){notice=said;render();pollQueue();};
    if(!cur||cur.file!==file){show();return;}
    reloadMap(f).then(show);
  }).catch(function(){sending=false;notice="the server did not answer — is human serve running?";bad=true;render();});
}

function decompile(){
  ask({name:nameOf(cur.file),kind:"decompile",id:null,text:""});
}

function expandOpen(entry,words){
  keepBox();
  expanding={file:cur.file,entry:entry,words:words};
  editing={file:cur.file,kind:"expand",id:null};
  caretWanted=0;
  render();
  rows.scrollTop=0;
}

function expandClose(){
  if(!expandHere()) return;
  var k=key(cur.file,"expand",null);
  delete typed[k];
  if(isEditing("expand",null)) editing=null;
  expanding=null;
  render();
}

function expandSend(){
  if(!expandHere()) return;
  keepBox();
  var x=expanding, text=shownText("expand",null);
  if(isEditing("expand",null)) editing=null;
  ask({name:nameOf(cur.file),kind:"expand",id:x.entry,text:text,words:x.words},function(){
    delete typed[key(x.file,"expand",null)];
    if(expanding===x) expanding=null;
  });
}

function create(entry){
  ask({name:nameOf(cur.file),kind:"create",id:entry,text:""});
}

function deleteOpen(entry){
  keepBox();
  deleting={file:cur.file,entry:entry};
  render();
}

function deleteClose(){
  if(!deleteHere()) return;
  deleting=null;
  render();
}

function deleteSend(){
  if(!deleteHere()) return;
  var x=deleting;
  if(isEditing("retext",x.entry)) editing=null;
  ask({name:nameOf(cur.file),kind:"delete",id:x.entry,text:""},function(){
    var k=key(x.file,"retext",x.entry);
    localStorage.removeItem(k); delete typed[k]; delete openSet[x.entry];
    if(deleting===x) deleting=null;
  });
}

var ctx=document.getElementById("ctx");
function menuAt(ev,items){
  ev.preventDefault();
  ctx.innerHTML="";
  items.forEach(function(it){
    var d=document.createElement("div");
    d.textContent=it.label;
    d.addEventListener("mousedown",function(e){e.preventDefault();e.stopPropagation();});
    d.addEventListener("click",function(e){e.stopPropagation();menuClose();it.act();});
    ctx.appendChild(d);
  });
  ctx.hidden=false;
  var w=ctx.offsetWidth, h=ctx.offsetHeight;
  ctx.style.left=Math.min(ev.clientX,window.innerWidth-w-6)+"px";
  ctx.style.top=Math.min(ev.clientY,window.innerHeight-h-6)+"px";
}
function menuClose(){ctx.hidden=true;}

function selectedRaw(ev){
  var ta=ev.target.closest(".chunk textarea");
  if(ta){
    if(!editing||editing.kind!=="retext") return null;
    var raw=ta.value.slice(ta.selectionStart,ta.selectionEnd);
    return raw.trim()?{entry:editing.id,words:raw}:null;
  }
  var ch=ev.target.closest('.chunk[data-edit="retext"]');
  if(!ch) return null;
  var sel=window.getSelection();
  if(!sel||sel.isCollapsed||!sel.rangeCount) return null;
  var r=sel.getRangeAt(0);
  if(!ch.contains(r.startContainer)||!ch.contains(r.endContainer)) return null;
  var id=+ch.getAttribute("data-id"), e=byId[id], text=e.text;
  var a=document.createRange(); a.setStart(ch,0); a.setEnd(r.startContainer,r.startOffset);
  var b=document.createRange(); b.setStart(ch,0); b.setEnd(r.endContainer,r.endOffset);
  var raw=text.slice(rawOffset(text,a.toString().length,e),rawOffset(text,b.toString().length,e));
  return raw.trim()?{entry:id,words:raw}:null;
}

function reloadMap(f){
  var url=f.file==="human/project.json"?"project.json":"explanation_"+f.file.replace(/\//g,"__")+".json";
  return fetch(url,{cache:"no-store"}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;})
    .then(function(d){
      if(d&&Array.isArray(d.explanations)) f.d=d;
      if(cur&&cur.file===f.file) open(cur.proj,f);
    });
}

function compile(){
  if(!cur||sending) return;
  keepBox();
  var todo=slots().filter(function(s){return changed(s.kind,s.id);});
  if(!todo.length) return;
  var f=fileOf(cur.file), name=nameOf(cur.file), file=cur.file;
  var texts=todo.map(function(s){return shownText(s.kind,s.id);});
  sending=true; bad=false; notice="compiling…"; editing=null;
  render();
  var says=[], failed=false, codeOk=false;
  var done=function(){
    sending=false;
    var show=function(){notice=says.join("\n");bad=failed;render();pollQueue();};
    if(!cur||cur.file!==file){show();return;}
    if(codeOk) open(cur.proj,f);
    reloadMap(f).then(show);
  };
  var step=function(i){
    if(i>=todo.length){done();return;}
    var s=todo[i], body={name:name,kind:s.kind,id:s.id,text:texts[i]};
    var label=s.kind==="code"?"the code":s.kind==="map"?"the abstraction":"entry "+s.id;
    fetch("compile",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
      .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
      .then(function(x){
        if(!x.ok){says.push(label+": "+(x.j.error||"refused"));failed=true;step(i+1);return;}
        var k=key(file,s.kind,s.id);
        localStorage.removeItem(k); delete typed[k];
        if(s.kind==="code"){f.code=body.text;codeOk=true;}
        says.push(x.j.output+(x.j.seq?"  ·  event "+x.j.seq+" waits for claude":""));
        step(i+1);
      })
      .catch(function(){says.push(label+": the server did not answer — is human serve running?");failed=true;step(i+1);});
  };
  step(0);
}

function fileNamed(name){return fileOf(name==="project"?"human/project.json":name);}

function pollQueue(){
  fetch("server/queue",{cache:"no-store"}).then(function(r){return r.json();}).then(function(q){
    var by={};
    q.pending.forEach(function(x){(by[x.name]=by[x.name]||[]).push(x);});
    var same=JSON.stringify(by)===JSON.stringify(pendingBy);
    var gone=Object.keys(pendingBy).filter(function(n){return !by[n];});
    pendingBy=by;
    if(same) return;
    gone.forEach(function(n){var f=fileNamed(n);if(f) reloadMap(f);});
    if(cur&&!editing) render();
    if(gone.length) loadTrain();
  }).catch(function(){});
}
setInterval(pollQueue,3000);

function jump(id){
  openSet[id]=1;
  render();
  var el=rows.querySelector('[data-entry="'+id+'"]');
  if(!el) return;
  el.scrollIntoView({behavior:"smooth",block:"start"});
  el.classList.add("flash");
  setTimeout(function(){el.classList.remove("flash");},900);
}

function flashAnchor(id,words){
  var el=rows.querySelector('[data-entry="'+id+'"]');
  if(!el) return;
  var hit=null;
  el.querySelectorAll(".anch").forEach(function(sp){if(!hit&&sp.textContent.trim()===words)hit=sp;});
  if(!hit) return;
  hit.scrollIntoView({behavior:"smooth",block:"center"});
  hit.classList.add("flash");
  setTimeout(function(){hit.classList.remove("flash");},900);
}

function crossJump(fname,bname,eid,words){
  var f=fileOf(fname);
  if(!f) return;
  open(cur.proj,f);
  buildTree(cur.proj,fname);
  if(!f.d.explanations.length){render();return;}
  var id=null;
  if(eid){
    if(!byId[eid]){notice="no entry "+eid+" in this map";render();return;}
    jump(eid);
    setTimeout(function(){flashAnchor(eid,words);},50);
    return;
  }
  if(bname){
    id=blockId[bname];
    if(id===undefined){notice="no entry for "+bname+" yet";render();return;}
  }else{
    f.d.explanations.forEach(function(e){
      if(e.block===f.file&&(id===null||e.id<id)) id=e.id;
    });
    if(id===null&&order.length) id=order[order.length-1].id;
  }
  if(id!=null) jump(id);
}

rows.addEventListener("input",function(ev){
  if(!editing||!ev.target.matches(".chunk textarea")) return;
  keep(ev.target.value);
  fit(ev.target);
  header();
});

rows.addEventListener("focusout",function(ev){
  if(!editing||!ev.target.isConnected||!ev.target.matches(".chunk textarea")) return;
  if(ev.target.getAttribute("data-slot")!==key(editing.file,editing.kind,editing.id)) return;
  leaveEdit(ev.target.value);
});

rows.addEventListener("contextmenu",function(ev){
  if(!cur||!nameOf(cur.file)||sending) return;
  var fd=ev.target.closest(".bhead[data-fold]");
  if(fd){
    var id=+fd.getAttribute("data-fold");
    menuAt(ev,[{label:"create abstraction",act:function(){create(id);}},
               {label:"delete abstraction",act:function(){deleteOpen(id);}}]);
    return;
  }
  var pick=selectedRaw(ev);
  if(!pick) return;
  menuAt(ev,[{label:"expand abstraction",act:function(){expandOpen(pick.entry,pick.words);}}]);
});

document.addEventListener("mousedown",function(ev){if(!ctx.hidden&&!ctx.contains(ev.target)) menuClose();});
document.addEventListener("keydown",function(ev){if(ev.key==="Escape"){menuClose();deleteClose();if(tconfirm){tconfirm=false;renderTop();}}});
rows.addEventListener("scroll",menuClose);

rows.addEventListener("mousedown",function(ev){
  if(ev.button!==0||ev.target.closest("textarea")) return;
  if(ev.target.closest(".act")){ev.preventDefault();return;}
  if(ev.target.closest(".anch[data-file],.anch[data-child]")) return;

rows.addEventListener("keydown",function(ev){

document.addEventListener("keydown",function(ev){

var SLOTS=["best","refinement","free"];
var deck=document.getElementById("deck"), tsel=document.getElementById("tsel"), tlayer=document.getElementById("train"), tchip=document.getElementById("tchip"), tnote=document.getElementById("tnote");
var tses=[], tcur=null, tsig={}, tasking=null, tviewing={}, twant=null, tshow=false, terr=null, tconfirm=false, tbusy=false;

function hideKey(sid){return "human-train-hide:"+sid;}

function versionOf(r,slot){
  var v=r.versions[slot];
  if(v===null) return null;
  if(typeof v==="string") return {text:v,shape:null,at:null,history:[]};
  return v;
}

function textsOf(v){
  return v.history.concat([{text:v.text,shape:v.shape,at:v.at}]);
}

function cardShown(r,i,slot){
  var v=versionOf(r,slot);
  if(!v) return null;
  var all=textsOf(v), n=tviewing[i+":"+slot];
  return all[n===undefined?all.length-1:Math.min(n,all.length-1)].text;
}

function cardText(t){
  var out="", last=0, m;
  ANCH.lastIndex=0;
  while((m=ANCH.exec(t))){
    out+=esc(t.slice(last,m.index))+'<span class="anch">'+esc(m[1])+'</span>';
    last=m.index+m[0].length;
  }
  return out+esc(t.slice(last));
}

function slotsOf(r){return r.kind==="sync"?SLOTS:["best","free"];}

function cardHtml(r,i,slot,k){
  var v=versionOf(r,slot), t=v?v.text:null, on=r.picked===slot;
  var dots=slotsOf(r).map(function(s,j){return j===k?"<b>●</b>":"●";}).join("");
  var label=slot;
  if(r.kind==="sync"&&slot==="refinement"&&t===r.before) label="current";
  var head='<div class="head"><span class="file">'+esc(r.file)+'</span><span>'+esc(r.kind)+' · '+esc(r.level)
    +(r.entry!==null?' · entry '+r.entry:"")+(r.block&&r.level==="above"?' · '+esc(r.block):"")
    +(r.target!==null&&r.target!==undefined?' · expands entry '+r.target:"")
    +(r.carried_from?' · carried':"")
    +'</span><span class="slot">'+esc(label)+'</span>'
    +(v&&v.shape?'<span class="shape">'+esc(v.shape)+'</span>':"")
    +(t===null?"":'<button class="copy" data-copy="'+i+'" data-slot="'+slot+'">copy</button>')
    +'<span class="dots">'+dots+'</span></div>';
  var vers="", shown=t, old=false;
  if(v&&v.history.length){
    var all=textsOf(v), n=tviewing[i+":"+slot];
    if(n===undefined||n>=all.length) n=all.length-1;
    shown=all[n].text; old=n<all.length-1;
    vers='<div class="vers"><span>rewrites</span>'+all.map(function(x,j){
      return '<button class="v'+(j===n?" on":"")+'" data-view="'+i+'" data-slot="'+slot+'" data-n="'+j+'">v'+(j+1)+'</button>';
    }).join("")+'<span class="at">'+(old?"earlier text":"latest — the pick takes this one")+(all[n].at?" · "+esc(all[n].at.slice(0,16).replace("T"," ")):"")+'</span></div>';
  }
  var body=t===null?'<div class="body empty">not written yet</div>':'<div class="body'+(old?" old":"")+'">'+cardText(shown)+'</div>';
  var why=on&&r.comment?'<span class="why">“'+esc(r.comment)+'”</span>':"";
  var foot, hint='<span class="hint">◂ ▸ versions · ▾ next file</span>';
  if(tcur.finished||r.applied)
    foot='<span class="note">'+(r.picked?(on?(r.defaulted?"taken by default":"picked"):"picked: "+r.picked):"no pick")+(r.applied?" · entry "+r.applied.entry:"")+'</span>'+why+hint;
  else if(on)
    foot='<button data-row="'+i+'" data-slot="">picked ✓ — undo</button>'+why+hint;
  else if(tasking&&tasking.row===i&&tasking.slot===slot)
    foot='<textarea placeholder="why this one? (optional)" maxlength="500">'+esc(tasking.text)+'</textarea>'
      +'<button class="pick" data-row="'+i+'" data-slot="'+slot+'" data-save="1">pick</button>'
      +'<button data-cancel="1">cancel</button>';
  else
    foot='<button class="pick" data-row="'+i+'" data-slot="'+slot+'"'+(t===null?" disabled":"")+'>pick this one</button>'
      +(r.picked?'<span class="note">picked: '+esc(r.picked)+'</span>':"")+hint;
  return '<div class="card'+(on?" on":"")+'">'+head+vers+body+'<div class="foot">'+foot+'</div></div>';
}

function rowHtml(r,i){
  return '<div class="strip">'+slotsOf(r).map(function(s,k){return cardHtml(r,i,s,k);}).join("")+'</div>';
}

function rerenderRow(i){
  var el=deck.querySelectorAll(".row")[i];
  if(!el) return;
  var strip=el.querySelector(".strip"), x=strip?strip.scrollLeft:0;
  el.innerHTML=rowHtml(tcur.rows[i],i);
  el.querySelector(".strip").scrollLeft=x;
  tsig[i]=JSON.stringify(tcur.rows[i]);
}

function renderRows(){
  if(!tcur.rows.length){deck.innerHTML='<div class="empty-deck">session '+esc(tcur.session_id)+' has no rows yet — claude writes the versions after the event</div>';tsig={};return;}
  var els=deck.querySelectorAll(".row");
  if(els.length!==tcur.rows.length){
    deck.innerHTML=tcur.rows.map(function(r,i){return '<section class="row" data-row="'+i+'">'+rowHtml(r,i)+'</section>';}).join("");
    tsig={};
    tcur.rows.forEach(function(r,i){tsig[i]=JSON.stringify(r);});
    return;
  }
  tcur.rows.forEach(function(r,i){
    var s=JSON.stringify(r);
    if(tsig[i]===s) return;
    tsig[i]=s;
    var el=els[i], strip=el.querySelector(".strip"), x=strip?strip.scrollLeft:0;
    el.innerHTML=rowHtml(r,i);
    el.querySelector(".strip").scrollLeft=x;
  });
}

function closeLine(){
  var picked=0, best=0, carry=0, wait=0;
  tcur.rows.forEach(function(r){
    if(r.applied) return;
    if(r.picked) picked++;
    else if(r.kind==="sync") carry++;
    else if(r.versions.best!==null||r.versions.free!==null) best++;
    else wait++;
  });
  var parts=[];
  if(picked) parts.push(picked+" picked");
  if(best) parts.push(best+(best>1?" rows take":" row takes")+" best");
  if(carry) parts.push(carry+" sync row"+(carry>1?"s carry":" carries")+" over");
  if(wait) parts.push(wait+" not written yet, "+(wait>1?"they carry":"it carries")+" over");
  return parts.length?parts.join(" · "):"nothing to apply";
}

function renderTop(){
  var html=tses.map(function(s){
    return '<option value="'+esc(s.session_id)+'"'+(s.session_id===tcur.session_id?" selected":"")+'>'+esc(s.session_id)+(s.finished?" ✓":"")+'</option>';
  }).join("");
  if(tsel.innerHTML!==html) tsel.innerHTML=html;
  var st=document.getElementById("tstate");
  st.textContent=tcur.finished?"FINISHED":"OPEN";
  st.className="state"+(tcur.finished?" done":"");
  var picked=tcur.rows.filter(function(r){return r.picked;}).length;
  document.getElementById("tcount").textContent=tcur.rows.length+" rows · "+picked+" picked";
  var tc=document.getElementById("tclose"), ch;
  if(tcur.finished) ch="";
  else if(tconfirm) ch='<span>'+esc(closeLine())+'</span> <button class="tb go" data-tact="confirm"'+(tbusy?" disabled":"")+'>close</button> <button class="tb" data-tact="cancel"'+(tbusy?" disabled":"")+'>cancel</button>';
  else ch='<button class="tb go" data-tact="close">close training</button>';
  if(tc.innerHTML!==ch) tc.innerHTML=ch;
}

function noteTrain(t,bad){
  tnote.hidden=!t; tnote.textContent=t||""; tnote.className=bad?"bad":"";
}

function chip(){
  var open=tses.filter(function(s){return !s.finished;})[0];
  if(terr){tchip.hidden=false;tchip.className="off";tchip.textContent=terr;return;}
  if(open){
    var picked=(tcur&&tcur.session_id===open.session_id?tcur.rows.filter(function(r){return r.picked;}).length:null);
    tchip.hidden=false;tchip.className="";
    tchip.textContent="training · "+open.rows+" rows"+(picked===null?"":" · "+picked+" picked")+" · show";
    return;
  }
  if(tses.length){tchip.hidden=false;tchip.className="";tchip.textContent="training";return;}
  tchip.hidden=true;
}

function showTrain(on){
  tshow=on;
  tlayer.hidden=!on;
  if(!on) tconfirm=false;
  chip();
}

function stored(r){
  return r.json().then(function(j){return r.ok?j:Promise.reject(j.error||String(r.status));},
    function(){return Promise.reject("the server did not answer");});
}

function loadTrain(){
  return fetch("training/",{cache:"no-store"}).then(stored).then(function(list){
    tses=list; terr=null;
    var open=list.filter(function(s){return !s.finished;})[0];
    var id=twant&&list.some(function(s){return s.session_id===twant;})?twant:(open||list[0]||{}).session_id||null;
    if(!id){tcur=null;showTrain(false);return;}
    if(open&&!twant){
      var was=localStorage.getItem(hideKey(open.session_id));
      if(was!==null&&open.rows>+was){localStorage.removeItem(hideKey(open.session_id));was=null;}
      if(!tshow&&was===null) showTrain(true);
    }
    if(!tshow&&(!tcur||tcur.session_id!==id)){tcur=null;chip();return;}
    return fetch("training/"+id+".json",{cache:"no-store"}).then(stored).then(function(d){
      var fresh=!tcur||tcur.session_id!==d.session_id;
      tcur=d;
      if(fresh){tsig={};tasking=null;tviewing={};deck.innerHTML="";}
      renderTop(); renderRows(); chip();
    });
  }).catch(function(e){terr=typeof e==="string"?e:"the training store did not answer";if(!tcur)showTrain(false);chip();});
}

function closeTrain(){
  if(!tcur||tbusy) return;
  tbusy=true; renderTop(); noteTrain("closing…",false);
  var sid=tcur.session_id, files={};
  tcur.rows.forEach(function(r){files[r.file]=1;});
  fetch("training/"+sid+"/close",{method:"POST"})
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
    .then(function(x){
      tbusy=false; tconfirm=false;
      if(!x.ok){noteTrain(x.j.error||"the close was refused",true);return loadTrain();}
      Object.keys(files).forEach(function(n){var f=fileNamed(n);if(f) reloadMap(f);});
      noteTrain("",false);
      twant=null; tcur=null; localStorage.removeItem(hideKey(sid));
      showTrain(false);
      notice=x.j.output; bad=false;
      if(cur) render();
      pollQueue();
      return loadTrain();
    })
    .catch(function(){tbusy=false;renderTop();noteTrain("the server did not answer — is human serve running?",true);});
}

document.getElementById("ttop").addEventListener("click",function(ev){
  var b=ev.target.closest("button");
  if(!b) return;
  if(b.id==="thide"){
    if(tcur&&!tcur.finished) localStorage.setItem(hideKey(tcur.session_id),String(tcur.rows.length));
    showTrain(false);
    return;
  }
  var act=b.getAttribute("data-tact");
  if(act==="close"){tconfirm=true;renderTop();}
  else if(act==="cancel"){tconfirm=false;renderTop();}
  else if(act==="confirm") closeTrain();
});

tchip.addEventListener("click",function(){
  if(terr) return;
  var open=tses.filter(function(s){return !s.finished;})[0];
  if(open) localStorage.removeItem(hideKey(open.session_id));
  twant=open?null:(tses[0]||{}).session_id||null;
  showTrain(true);
  loadTrain();
});

tsel.addEventListener("change",function(){
  twant=tsel.value; tcur=null;
  loadTrain();
});

deck.addEventListener("click",function(ev){
  var b=ev.target.closest("button");
  if(!b||!tcur) return;
  if(b.hasAttribute("data-copy")){
    var ci=+b.getAttribute("data-copy");
    copyText(cardShown(tcur.rows[ci],ci,b.getAttribute("data-slot")),b);
    return;
  }
  if(b.hasAttribute("data-view")){
    var vi=+b.getAttribute("data-view");
    tviewing[vi+":"+b.getAttribute("data-slot")]=+b.getAttribute("data-n");
    rerenderRow(vi);
    return;
  }
  if(b.hasAttribute("data-cancel")){
    var was=tasking; tasking=null;
    if(was) rerenderRow(was.row);
    return;
  }
  if(!b.hasAttribute("data-row")) return;
  var row=+b.getAttribute("data-row"), slot=b.getAttribute("data-slot")||null;
  if(!slot){sendPick(row,null,null,b);return;}
  if(b.hasAttribute("data-save")){
    var ta=b.parentNode.querySelector("textarea");
    sendPick(row,slot,ta?ta.value.trim()||null:null,b);
    return;
  }
  var prev=tasking; tasking={row:row,slot:slot,text:""};
  if(prev&&prev.row!==row) rerenderRow(prev.row);
  rerenderRow(row);
  var f=deck.querySelectorAll(".row")[row].querySelector("textarea");
  if(f) f.focus();
});

deck.addEventListener("input",function(ev){
  if(tasking&&ev.target.tagName==="TEXTAREA") tasking.text=ev.target.value;
});

function copyText(t,b){
  var done=function(){b.textContent="copied";setTimeout(function(){b.textContent="copy";},1200);};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done);return;}
  var ta=document.createElement("textarea");
  ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
  done();
}

function sendPick(row,slot,comment,b){
  b.disabled=true;
  fetch("training/"+tcur.session_id+"/pick",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({row:row,picked:slot,comment:comment})})
    .then(function(r){return r.json().then(function(j){return r.ok?j:Promise.reject(j.error||r.status);});})
    .then(function(r){tasking=null;tcur.rows[row]=r;renderTop();rerenderRow(row);chip();})
    .catch(function(e){b.disabled=false;noteTrain("pick failed: "+e,true);});
}

loadTrain();
setInterval(loadTrain,5000);

rows.addEventListener("click",function(ev){
  if(ev.target.closest("textarea")) return;
  var act=ev.target.closest(".act");
  if(act){
    var a=act.getAttribute("data-act");
    if(a==="decompile") decompile();
    else if(a==="expand") expandSend();
    else if(a==="unexpand") expandClose();
    else if(a==="delete") deleteSend();
    else if(a==="undelete") deleteClose();
    return;
  }
  var xf=ev.target.closest(".anch[data-file]");
  if(xf){
    var ce=xf.getAttribute("data-entry");
    crossJump(xf.getAttribute("data-file"),xf.getAttribute("data-block"),ce?+ce:null,xf.getAttribute("data-words"));
    return;
  }
  var an=ev.target.closest(".anch[data-child]");
  if(an){jump(+an.getAttribute("data-child"));return;}
  if(ev.target.closest(".chunk[data-edit]")) return;
  var fd=ev.target.closest(".bhead[data-fold]");
  if(fd){
    var id=+fd.getAttribute("data-fold");
    if(openSet[id]) delete openSet[id]; else openSet[id]=1;
    render();
  }
});
</script>
</body>
</html>
