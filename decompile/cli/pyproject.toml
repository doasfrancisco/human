[project]
name = "dmap"
version = "1.0.0"
description = "Map flow-shape explanations onto real code lines, delta by delta"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dmap = "dmap:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["dmap"]
