<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>decompile — map reader</title>
<style>
  :root{
    --ground:#eef1f4; --surface:#fff; --surface-2:#f6f8fa; --ink:#151a22; --muted:#59636f;
    --faint:#8b95a1; --hair:#dde3e9; --spec:#0e7c86; --spec-wash:rgba(14,124,134,.11);
    --spec-wash-2:rgba(14,124,134,.05); --spec-line:rgba(14,124,134,.55);
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --ground:#0c0e13; --surface:#14181f; --surface-2:#191e27; --ink:#e7ebf1; --muted:#97a1af;
    --faint:#6c7684; --hair:#262d38; --spec:#3fd0dd; --spec-wash:rgba(63,208,221,.13);
    --spec-wash-2:rgba(63,208,221,.06); --spec-line:rgba(63,208,221,.55); }}
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
  main{height:100%;display:flex;gap:14px;padding:14px;}
  .pane{background:var(--surface);border:1px solid var(--hair);border-radius:10px;overflow:hidden;}
  #side{flex:0 0 240px;display:flex;flex-direction:column;gap:10px;}
  #projbar{display:flex;align-items:center;gap:9px;padding:8px 14px;font-size:13px;cursor:pointer;flex-shrink:0;}
  .caret{color:var(--faint);font-size:15px;line-height:1;}
  #projname{font-family:var(--mono);color:var(--muted);flex:1;}
  #projlist{flex-shrink:0;}
  #projlist .prow{font-family:var(--mono);font-size:13px;padding:6px 14px;cursor:pointer;}
  #projlist .prow:hover{background:var(--spec-wash);}
  #treewrap{flex:1;min-height:0;display:flex;flex-direction:column;}
  #tree{flex:1;min-height:0;}
  #viewport{flex:1;min-width:0;overflow:hidden;position:relative;}
  #strip{display:flex;gap:28px;align-items:stretch;height:100%;padding:0 4px;transition:transform .35s cubic-bezier(.2,.7,.2,1);will-change:transform;}
  .layer{flex:0 0 460px;display:flex;flex-direction:column;cursor:pointer;}
  .layer[hidden]{display:none;}
  .layer.focus,.codepane.focus{border-color:var(--spec-line);}
  .phead{font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--hair);padding:5px 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;}
  .rows{flex:1;min-height:0;overflow-y:auto;padding:6px 0;}
  .group{font-family:var(--mono);font-size:11px;color:var(--faint);padding:8px 14px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .trow{display:flex;gap:10px;padding:5px 14px;cursor:pointer;font-size:14px;transition:background .12s;}
  .trow .rid{font-family:var(--mono);font-size:11px;color:var(--spec);flex-shrink:0;min-width:3em;padding-top:2px;}
  .trow.hov{background:var(--spec-wash);}
  .trow.rel{background:var(--spec-wash-2);}
  .trow.sel{background:var(--spec-line);color:#fff;}
  .trow.sel .rid{color:#fff;}
  .codepane{flex:0 0 min(52vw,780px);display:flex;flex-direction:column;cursor:pointer;}
  .codewrap{flex:1;min-height:0;overflow:auto;padding:10px 0;}
  .crow{display:flex;padding:0 14px;font-family:var(--mono);font-size:13px;line-height:1.62;white-space:pre;transition:background .12s;}
  .crow .ln{display:inline-block;width:4ch;margin-right:14px;text-align:right;color:var(--faint);user-select:none;flex-shrink:0;}
  .crow.hov{background:var(--spec-wash);}
  .crow.rel{background:var(--spec-wash-2);}
  .crow.sel{background:var(--spec-line);color:#fff;}
  .crow.sel .ln{color:#fff;}
  #msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;}
  #msg[hidden]{display:none;}
</style>
</head>
<body>
<main>
  <div id="side">
    <section class="pane" id="projbar"><span class="caret">‹</span><span id="projname"></span></section>
    <section class="pane" id="projlist" hidden></section>
    <section class="pane" id="treewrap"><div id="tree"></div></section>
  </div>
  <div id="viewport"><div id="strip"></div><div id="msg" hidden></div></div>
</main>
<script type="module">
import { FileTree } from "./trees.js";

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
var projs=[], cur=null, lines=[], byId={}, depths=[], nb={}, sel=null, hov=null, focusK=0, mode="dock", ft=null;
var strip=document.getElementById("strip"), viewport=document.getElementById("viewport");

function msg(t){var el=document.getElementById("msg");el.hidden=!t;el.textContent=t||"";}

fetch("projects.json").then(function(r){return r.json();}).then(function(j){
  return Promise.all((j.projects||[]).map(function(p){
    return fetch(p+"/map.json").then(function(r){return r.ok?r.json():null;})
      .then(function(m){return m&&Array.isArray(m.map)?{name:p,file:m.file,m:m}:null;})
      .catch(function(){return null;});
  }));
}).then(function(ps){
  projs=ps.filter(Boolean);
  if(!projs.length){msg("no tree maps — serve decompile_v2/ and compile a project");return;}
  ft=new FileTree({paths:[projs[0].file],initialExpansion:"open",initialSelectedPaths:[projs[0].file]});
  ft.render({fileTreeContainer:document.getElementById("tree")});
  open(projs[0]);
}).catch(function(){msg("could not load — serve decompile_v2/ and open /web.html");});

document.getElementById("projbar").addEventListener("click",function(){
  var el=document.getElementById("projlist");
  el.innerHTML=projs.map(function(p,i){return '<div class="prow" data-i="'+i+'">'+esc(p.name)+'</div>';}).join("");
  el.hidden=!el.hidden;
});
document.getElementById("projlist").addEventListener("click",function(e){
  var row=e.target.closest(".prow");
  if(!row) return;
  document.getElementById("projlist").hidden=true;
  var p=projs[+row.getAttribute("data-i")];
  if(p!==cur){ft.resetPaths([p.file]);open(p);}
});

function open(p){
  cur=p;
  document.getElementById("projname").textContent=p.name;
  fetch(p.name+"/"+p.file).then(function(r){return r.ok?r.text():null;}).then(function(t){
    if(t===null){msg("could not load "+p.file);return;}
    msg("");
    lines=t.replace(/\n$/,"").split("\n");
    buildIndex();
    sel=null; hov=null; focusK=0; mode="dock";
    render();
  });
}

function buildIndex(){
  byId={}; depths=[];
  (function walk(ns,depth,parent,anc){
    ns.forEach(function(t){
      byId[t.id]={id:t.id,text:t.text,lines:t.lines||[],depth:depth,parent:parent,anc:anc,maxd:depth};
      (depths[depth]=depths[depth]||[]).push(t.id);
      if(t.children) walk(t.children,depth+1,t.id,anc.concat(t.id));
    });
  })(cur.m.map,0,null,[]);
  Object.keys(byId).forEach(function(id){
    byId[id].anc.forEach(function(a){byId[a].maxd=Math.max(byId[a].maxd,byId[id].depth);});
  });
  nb={};
  (cur.m.links||[]).forEach(function(l){
    l.used.forEach(function(u){
      (nb[l.def]=nb[l.def]||{})[u]=1;
      (nb[u]=nb[u]||{})[l.def]=1;
    });
  });
}

function near(a,b){return !!(a&&b&&nb[a]&&nb[a][b]);}

function render(){
  var html="";
  depths.forEach(function(ids,d){
    var head=d===0?cur.name+"/"+cur.file:"layer "+d;
    html+='<section class="pane layer'+(d===focusK?" focus":"")+'" data-k="'+d+'">'
      +'<div class="phead">'+esc(head)+'</div><div class="rows">';
    var prev=null;
    ids.forEach(function(id){
      var t=byId[id];
      if(d>0&&t.parent!==prev){
        html+='<div class="group">'+t.parent+' · '+esc(byId[t.parent].text)+'</div>';
        prev=t.parent;
      }
      html+='<div class="trow" data-id="'+id+'"><span class="rid">'+id+'</span><span>'+esc(t.text)+'</span></div>';
    });
    html+='</div></section>';
  });
  html+='<section class="pane codepane'+(focusK===depths.length?" focus":"")+'" data-k="'+depths.length+'">'
    +'<div class="phead" id="codehead"></div><div class="codewrap">'
    +lines.map(function(l,i){
      return '<div class="crow" data-n="'+(i+1)+'"><span class="ln">'+(i+1)+'</span><span>'+(esc(l)||" ")+'</span></div>';
    }).join("")
    +'</div></section>';
  strip.innerHTML=html;
  paintAll();
  applyFocus();
}

function relTo(id){
  if(!id) return {};
  var out={};
  byId[id].anc.forEach(function(a){out[a]=1;});
  Object.keys(byId).forEach(function(o){if(byId[o].parent===id)out[o]=1;});
  Object.keys(nb[id]||{}).forEach(function(o){out[o]=1;});
  return out;
}

function inRanges(id,n){
  return !!id&&byId[id].lines.some(function(r){return r[0]<=n&&n<=r[1];});
}

function paintAll(){
  var selRel=relTo(sel), hovRel=hov&&hov!==sel?relTo(hov):{};
  strip.querySelectorAll(".trow").forEach(function(row){
    var id=row.getAttribute("data-id");
    row.classList.toggle("sel",id===sel);
    row.classList.toggle("hov",!!hov&&id===hov);
    row.classList.toggle("rel",id!==sel&&(!!selRel[id]||!!hovRel[id]));
  });
  var hovLink=Object.keys(nb[hov]||{});
  strip.querySelectorAll(".crow").forEach(function(row){
    var n=+row.getAttribute("data-n");
    var s=inRanges(sel,n);
    row.classList.toggle("sel",s);
    row.classList.toggle("hov",!s&&inRanges(hov,n));
    row.classList.toggle("rel",!s&&hovLink.some(function(o){return inRanges(o,n);}));
  });
  document.getElementById("codehead").textContent=cur.name+"/"+cur.file+(sel?"  ·  "+sel:"");
}

strip.addEventListener("click",function(e){
  var row=e.target.closest(".trow");
  if(row){
    setSel(row.getAttribute("data-id"));
    return;
  }
  var crow=e.target.closest(".crow");
  if(crow){
    var o=ownerOf(+crow.getAttribute("data-n"));
    if(o){setSel(o);return;}
  }
  var p=e.target.closest(".layer,.codepane");
  if(p){
    mode="center";
    focusK=+p.getAttribute("data-k");
    setFocusClass();
    applyFocus();
  }
});

function setSel(id){
  sel=sel===id?null:id;
  if(sel){mode="dock";focusK=byId[sel].depth;}
  updatePanes();
  setFocusClass();
  paintAll();
  if(sel) reveal();
  applyFocus();
}

function updatePanes(){
  strip.querySelectorAll(".layer").forEach(function(p){
    p.hidden=!!sel&&+p.getAttribute("data-k")>byId[sel].maxd;
  });
}

function setFocusClass(){
  strip.querySelectorAll(".layer,.codepane").forEach(function(p){
    p.classList.toggle("focus",+p.getAttribute("data-k")===focusK);
  });
}

function ownerOf(n){
  var best=null;
  Object.keys(byId).forEach(function(id){
    if(inRanges(id,n)&&(!best||byId[id].depth>byId[best].depth)) best=id;
  });
  return best;
}
strip.addEventListener("mouseover",function(e){
  var row=e.target.closest(".trow");
  var id=row?row.getAttribute("data-id"):null;
  if(id!==hov){hov=id;paintAll();}
});
strip.addEventListener("mouseleave",function(){
  if(hov){hov=null;paintAll();}
});

function firstChild(id){
  var child=null;
  Object.keys(byId).some(function(o){if(byId[o].parent===id){child=o;return true;}return false;});
  return child;
}

function reveal(){
  var wrap=strip.querySelector(".codewrap");
  var first=wrap.querySelector(".crow.sel");
  if(first) wrap.scrollTop=first.offsetTop-wrap.offsetTop-wrap.clientHeight/2;
  var child=firstChild(sel);
  if(child){
    var row=strip.querySelector('.trow[data-id="'+child+'"]');
    var rows=row.closest(".rows");
    rows.scrollTop=row.offsetTop-rows.offsetTop-40;
  }
}

function applyFocus(){
  var el=strip.querySelector('[data-k="'+focusK+'"]');
  if(!el||el.hidden) el=strip.querySelector(".layer:not([hidden]),.codepane");
  if(!el) return;
  var off=mode==="dock"?4-el.offsetLeft:viewport.clientWidth/2-(el.offsetLeft+el.offsetWidth/2);
  strip.style.transform="translateX("+off+"px)";
}

window.addEventListener("resize",applyFocus);
</script>
</body>
</html>
