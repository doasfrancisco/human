<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>decompile — pseudo reader</title>
<style>
  :root{
    --ground:#eef1f4; --surface:#fff; --surface-2:#f6f8fa; --ink:#151a22; --muted:#59636f;
    --faint:#8b95a1; --hair:#dde3e9; --spec:#0e7c86; --spec-wash:rgba(14,124,134,.11);
    --spec-wash-2:rgba(14,124,134,.05); --spec-line:rgba(14,124,134,.55); --call:#a15c00;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --ground:#0c0e13; --surface:#14181f; --surface-2:#191e27; --ink:#e7ebf1; --muted:#97a1af;
    --faint:#6c7684; --hair:#262d38; --spec:#3fd0dd; --spec-wash:rgba(63,208,221,.13);
    --spec-wash-2:rgba(63,208,221,.06); --spec-line:rgba(63,208,221,.55); --call:#e0a458; }}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{margin:0;height:100dvh;display:flex;flex-direction:column;background:var(--surface);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
  #topbar{flex-shrink:0;position:sticky;top:0;z-index:2;background:var(--surface-2);border-bottom:1px solid var(--hair);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));padding-left:calc(14px + env(safe-area-inset-left));padding-right:calc(14px + env(safe-area-inset-right));display:flex;align-items:center;gap:9px;cursor:pointer;min-height:44px;}
  .caret{color:var(--faint);font-size:15px;line-height:1;}
  #projname{font-family:var(--mono);font-size:14px;color:var(--muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #projcount{font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap;}
  #projlist{flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--hair);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);}
  #projlist .prow{font-family:var(--mono);font-size:14px;padding:12px 14px;min-height:44px;display:flex;align-items:center;cursor:pointer;border-top:1px solid var(--hair);}
  #projlist .prow.cur{color:var(--spec);}
  #maprows{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:6px 0;padding-bottom:calc(20px + env(safe-area-inset-bottom));padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);}
  .divider{border-top:1px solid var(--hair);margin:7px 14px 3px;}
  .bhead{font-family:var(--mono);font-size:12px;color:var(--muted);padding:12px 14px 2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .group{font-family:var(--mono);font-size:12px;color:var(--faint);padding:10px 14px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
  .pill{font-family:var(--mono);font-size:12px;color:var(--faint);padding:8px 14px;}
  .trow{display:flex;gap:10px;padding:10px 14px;min-height:44px;align-items:center;cursor:pointer;font-size:16px;}
  .trow>span{white-space:pre-line;min-width:0;overflow-wrap:anywhere;word-break:break-word;}
  .trow.rel{background:var(--spec-wash-2);}
  .trow.sel{background:var(--spec-line);color:#fff;}
  .call{color:var(--call);cursor:pointer;border-bottom:1px dashed var(--call);}
  .call.on{color:var(--spec);border-bottom-color:var(--spec);}
  .trow.sel .call{color:#fff;border-bottom-color:#fff;}
  .term{color:var(--call);cursor:pointer;border-bottom:1px dashed var(--call);}
  .term.on{color:var(--spec);border-bottom-color:var(--spec);}
  .trow.sel .term{color:#fff;border-bottom-color:#fff;}
  .story{margin:0 14px 8px 28px;padding:2px 0 2px 10px;border-left:2px solid var(--hair);font-size:14px;color:var(--muted);white-space:pre-line;overflow-wrap:anywhere;}
  .termcard{margin:2px 14px 8px 28px;padding:6px 10px;border-left:2px dashed var(--hair);font-size:14px;color:var(--muted);overflow-wrap:anywhere;}
  .termcard .tname{color:var(--spec);}
  .codecard{margin:2px 14px 8px 20px;background:var(--surface-2);border:1px solid var(--hair);border-radius:8px;overflow-x:auto;padding:6px 0;}
  .crow{display:flex;padding:0 12px;font-family:var(--mono);font-size:12.5px;line-height:1.62;white-space:pre;}
  .crow .ln{display:inline-block;width:4ch;margin-right:12px;text-align:right;color:var(--faint);user-select:none;flex-shrink:0;}
  .cgap{height:9px;}
  #msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:15px;padding:20px;text-align:center;}
  #msg[hidden]{display:none;}
</style>
</head>
<body>
<header id="topbar"><span class="caret">‹</span><span id="projname"></span><span id="projcount"></span></header>
<div id="projlist" hidden></div>
<div id="maprows"></div>
<div id="msg" hidden></div>
<script type="module">
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
var projs=[], cur=null, lines=[], byId={}, fnByName={}, fnIds=[], nb={}, revealed={}, cuts={}, roots=[], sel=null, terms=[], termOpen=null, codeOpen={};
var maprows=document.getElementById("maprows");

function msg(t){var el=document.getElementById("msg");el.hidden=!t;el.textContent=t||"";}

fetch("projects.json",{cache:"no-store"}).then(function(r){return r.json();}).then(function(j){
  return Promise.all((j.projects||[]).map(function(p){
    return fetch(p+"/map.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null;})
      .then(function(m){return m&&Array.isArray(m.map)?{name:p,file:m.file,m:m}:null;})
      .catch(function(){return null;});
  }));
}).then(function(ps){
  projs=ps.filter(Boolean);
  if(!projs.length){msg("no maps — serve decompile_v2/ and compile a project");return;}
  open(projs[0]);
}).catch(function(){msg("could not load — serve decompile_v2/ and open /web_mobile.html");});

document.getElementById("topbar").addEventListener("click",function(){
  var el=document.getElementById("projlist");
  el.innerHTML=projs.map(function(p,i){
    return '<div class="prow'+(p===cur?" cur":"")+'" data-i="'+i+'">'+esc(p.name)+'</div>';
  }).join("");
  el.hidden=!el.hidden;
});
document.getElementById("projlist").addEventListener("click",function(e){
  var row=e.target.closest(".prow");
  if(!row) return;
  document.getElementById("projlist").hidden=true;
  var p=projs[+row.getAttribute("data-i")];
  if(p!==cur) open(p);
});

function open(p){
  cur=p;
  document.getElementById("projname").textContent=p.name;
  document.getElementById("projcount").textContent="";
  if(!p.m.map.length||p.m.map[0].name===undefined){
    maprows.innerHTML="";
    msg("old map format — recompile this project with the block decompiler");
    return;
  }
  fetch(p.name+"/"+p.file,{cache:"no-store"}).then(function(r){return r.ok?r.text():null;}).then(function(t){
    if(t===null){msg("could not load "+p.file);return;}
    msg("");
    lines=t.replace(/\n$/,"").split("\n");
    buildIndex();
    terms=cur.m.terms||[];
    sel=null; termOpen=null; codeOpen={};
    initView();
    renderAll();
    maprows.scrollTop=0;
  });
}

function buildIndex(){
  byId={}; fnByName={}; fnIds=[];
  var ord=0;
  cur.m.map.forEach(function(t){
    fnByName[t.name]=t.id; fnIds.push(t.id);
    (function walk(ns,depth,parent,anc,rf){
      ns.forEach(function(n){
        byId[n.id]={id:n.id,text:n.text,story:n.story,lines:n.lines||[],depth:depth,parent:parent,anc:anc,ord:ord++,rf:rf,
                    kids:(n.children||[]).map(function(c){return c.id;}),
                    name:n.name,layer:n.layer,calls:n.calls};
        if(n.children) walk(n.children,depth+1,n.id,anc.concat(n.id),rf);
      });
    })([t],0,null,[],t.id);
  });
  var calledSet={};
  cur.m.map.forEach(function(t){(t.calls||[]).forEach(function(n){calledSet[n]=1;});});
  roots=fnIds.filter(function(id){return !calledSet[byId[id].name];});
  if(!roots.length) roots=fnIds.slice(0,1);
  nb={};
  (cur.m.links||[]).forEach(function(l){
    l.used.forEach(function(u){
      (nb[l.def]=nb[l.def]||{})[u]=1;
      (nb[u]=nb[u]||{})[l.def]=1;
    });
  });
}

function initView(){
  revealed={}; cuts={};
  roots.forEach(function(id){revealed[id]=1;cuts[id]=[id];});
}

function expandIn(rf,id){
  var cut=cuts[rf], i=cut.indexOf(id);
  if(i<0||!byId[id].kids.length) return;
  cut.splice.apply(cut,[i,1].concat(byId[id].kids));
}

function collapseIn(rf,pid){
  var keep=[], placed=false;
  cuts[rf].forEach(function(id){
    if(id===pid||byId[id].anc.indexOf(pid)>=0){
      if(!placed){keep.push(pid);placed=true;}
    }else keep.push(id);
  });
  cuts[rf]=keep;
}

function cutRows(rf){
  var cut=cuts[rf], titled={}, at={}, ends={};
  cut.forEach(function(id){
    var p=byId[id].parent;
    if(p!==null) titled[p]=1;
  });
  cut.forEach(function(id,i){
    byId[id].anc.forEach(function(a){
      if(titled[a]&&at[a]===undefined) at[a]=i;
    });
  });
  cut.forEach(function(id,i){
    byId[id].anc.forEach(function(a){
      if(titled[a]) ends[a]=i;
    });
  });
  var starts={}, endsAt={};
  Object.keys(at).forEach(function(a){(starts[at[a]]=starts[at[a]]||[]).push(a);});
  Object.keys(ends).forEach(function(a){endsAt[ends[a]]=1;});
  return cut.map(function(id,i){
    return {id:id,
      titles:(starts[i]||[]).sort(function(a,b){return byId[a].depth-byId[b].depth;}),
      div:!!endsAt[i]&&i<cut.length-1};
  });
}

function dispName(id){
  var t=byId[id];
  return t.name==="script"?t.name:t.name+"()";
}

function markText(text,rf){
  var h=esc(text);
  terms.forEach(function(t,i){
    var re=new RegExp(t.term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"s?\\b","gi");
    h=h.replace(re,function(m0){
      return '<span class="term'+(termOpen&&termOpen.ti===i?" on":"")+'" data-ti="'+i+'">'+m0+'</span>';
    });
  });
  var path=byId[rf].name.split(".");
  return h.split(/(<[^>]*>)/).map(function(seg){
    if(seg.charAt(0)==="<") return seg;
    return seg.replace(/([A-Za-z_][A-Za-z0-9_]*)/g,function(m0,nm,off,s){
      if(off>0&&s.charAt(off-1)===".") return m0;
      var fid=null;
      for(var k=path.length;k>=0;k--){
        var cand=path.slice(0,k).concat([nm]).join(".");
        if(fnByName[cand]){fid=fnByName[cand];break;}
      }
      if(!fid||fid===rf) return m0;
      return '<span class="call'+(revealed[fid]?" on":"")+'" data-fn="'+fid+'">'+m0+'</span>';
    });
  }).join("");
}

function nonBlank(a,b){
  var k=0;
  for(var n=a;n<=b;n++) if(lines[n-1]&&lines[n-1].trim()) k++;
  return k;
}

function termCard(tt){
  var h='<div class="termcard"><span class="tname">'+esc(tt.term)+'</span> — '+esc(tt.meaning||tt.text||"");
  if(tt.defs&&tt.defs.length){
    h+='<br>defined at '+tt.defs.map(function(d){return d[0]+'–'+d[1];}).join(" · ");
  }
  return h+'</div>';
}

function storyHtml(id){
  if(!byId[id].story) return "";
  var h='<div class="story" data-id="'+id+'">'+markText(byId[id].story,id)+'</div>';
  if(termOpen&&termOpen.row==="story:"+id&&terms[termOpen.ti]) h+=termCard(terms[termOpen.ti]);
  return h;
}

function codeCard(id){
  var html='<div class="codecard">';
  byId[id].lines.forEach(function(r,si){
    if(si) html+='<div class="cgap"></div>';
    for(var n=r[0];n<=r[1];n++){
      html+='<div class="crow"><span class="ln">'+n+'</span><span>'+(esc(lines[n-1]||"")||" ")+'</span></div>';
    }
  });
  return html+'</div>';
}

function renderMap(){
  var segs=[];
  Object.keys(revealed).forEach(function(fid){
    byId[fid].lines.forEach(function(r,si){segs.push({fid:fid,a:r[0],b:r[1],first:si===0});});
  });
  segs.sort(function(x,y){return x.a-y.a;});
  var rowsBy={};
  Object.keys(revealed).forEach(function(fid){rowsBy[fid]=cutRows(fid);});
  var html="", pos=1;
  segs.forEach(function(s){
    if(s.a>pos&&nonBlank(pos,s.a-1)) html+='<div class="pill">▹ '+nonBlank(pos,s.a-1)+' hidden lines</div>';
    html+='<div class="bhead" data-id="'+s.fid+'">'+esc(dispName(s.fid))+(s.first?"":" · continued")+'</div>';
    rowsBy[s.fid].forEach(function(r){
      var fl=(byId[r.id].lines[0]||[0])[0];
      if(fl<s.a||fl>s.b) return;
      r.titles.forEach(function(a){
        html+='<div class="group" data-id="'+a+'">'+esc(byId[a].text)+'</div>';
        if(a===s.fid&&s.first) html+=storyHtml(a);
      });
      html+='<div class="trow" data-id="'+r.id+'"><span>'+markText(byId[r.id].text,s.fid)+'</span></div>';
      if(r.id===s.fid&&s.first) html+=storyHtml(r.id);
      if(codeOpen[r.id]) html+=codeCard(r.id);
      if(termOpen&&termOpen.row===r.id&&terms[termOpen.ti]) html+=termCard(terms[termOpen.ti]);
      if(r.div) html+='<div class="divider"></div>';
    });
    pos=Math.max(pos,s.b+1);
  });
  if(pos<=lines.length&&nonBlank(pos,lines.length)) html+='<div class="pill">▹ '+nonBlank(pos,lines.length)+' hidden lines</div>';
  maprows.innerHTML=html;
  document.getElementById("projcount").textContent=Object.keys(revealed).length+"/"+fnIds.length+" blocks";
}

function renderAll(){renderMap();paintAll();}

function near(a,b){return !!(a&&b&&nb[a]&&nb[a][b]);}

function paintAll(){
  maprows.querySelectorAll(".trow").forEach(function(row){
    var id=row.getAttribute("data-id");
    row.classList.toggle("sel",id===sel);
    row.classList.toggle("rel",id!==sel&&near(sel,id));
  });
}

function revealMap(id){
  var row=maprows.querySelector('.trow[data-id="'+id+'"],.bhead[data-id="'+id+'"]');
  if(row) maprows.scrollTop=row.offsetTop-maprows.offsetTop-maprows.clientHeight/3;
}

maprows.addEventListener("click",function(e){
  var tm=e.target.closest(".term");
  if(tm){
    var ti=+tm.getAttribute("data-ti");
    var host=e.target.closest(".trow,.story");
    var rowId=host?(host.classList.contains("story")?"story:"+host.getAttribute("data-id"):host.getAttribute("data-id")):null;
    if(termOpen&&termOpen.ti===ti&&termOpen.row===rowId) termOpen=null;
    else termOpen={ti:ti,row:rowId};
    renderAll();
    return;
  }
  var call=e.target.closest(".call");
  if(call){
    var fid=call.getAttribute("data-fn");
    if(revealed[fid]&&roots.indexOf(fid)<0){
      delete revealed[fid]; delete cuts[fid];
      if(sel&&byId[sel].rf===fid) sel=null;
      renderAll();
    }else if(!revealed[fid]){
      revealed[fid]=1; cuts[fid]=[fid];
      sel=fid;
      renderAll(); revealMap(fid);
    }
    return;
  }
  var bh=e.target.closest(".bhead");
  if(bh){
    var bid=bh.getAttribute("data-id");
    cuts[bid]=[bid];
    sel=bid;
    renderAll(); revealMap(bid);
    return;
  }
  var g=e.target.closest(".group");
  if(g){
    var pid=g.getAttribute("data-id");
    collapseIn(byId[pid].rf,pid);
    sel=pid;
    renderAll(); revealMap(pid);
    return;
  }
  var row=e.target.closest(".trow");
  if(!row) return;
  var id=row.getAttribute("data-id");
  if(byId[id].kids.length){
    expandIn(byId[id].rf,id);
    sel=id;
    renderAll();
  }else if(codeOpen[id]){
    delete codeOpen[id];
    if(sel===id) sel=null;
    renderAll();
  }else{
    codeOpen[id]=1;
    sel=id;
    renderAll();
  }
});
</script>
</body>
</html>
