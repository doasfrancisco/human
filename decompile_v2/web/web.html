<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>decompile — map reader</title>
<style>
  :root{
    --ground:#eef1f4; --surface:#fff; --surface-2:#f6f8fa; --ink:#151a22; --muted:#59636f;
    --faint:#8b95a1; --hair:#dde3e9; --spec:#0e7c86; --spec-wash:rgba(14,124,134,.11);
    --spec-line:rgba(14,124,134,.55);
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --ground:#0c0e13; --surface:#14181f; --surface-2:#191e27; --ink:#e7ebf1; --muted:#97a1af;
    --faint:#6c7684; --hair:#262d38; --spec:#3fd0dd; --spec-wash:rgba(63,208,221,.13);
    --spec-line:rgba(63,208,221,.55); }}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;}
  .pane{background:var(--surface);border:1px solid var(--hair);border-radius:10px;overflow:hidden;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
  main{max-width:1500px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px;min-height:100vh;}
  #cols{display:flex;align-items:flex-start;gap:14px;}
  #left{flex:0 0 44%;min-width:0;display:flex;flex-direction:column;gap:14px;position:sticky;top:16px;}
  #right{flex:1 1 0;min-width:0;}
  #projbar{display:flex;align-items:center;gap:9px;padding:8px 14px;font-size:13px;}
  .caret{color:var(--faint);font-size:15px;line-height:1;cursor:pointer;}
  #projbar #projname{font-family:var(--mono);color:var(--muted);cursor:pointer;flex:1;}
  #map{padding:8px 0;max-height:calc(100vh - 110px);overflow-y:auto;}
  .sect{font-family:var(--mono);font-size:11px;color:var(--faint);text-transform:lowercase;letter-spacing:.06em;padding:10px 16px 3px;}
  .trow{display:flex;gap:10px;padding:4px 16px;cursor:pointer;font-size:14px;transition:background .12s;}
  .trow .rid{font-family:var(--mono);font-size:11px;color:var(--spec);flex-shrink:0;min-width:3em;padding-top:2px;}
  #codefile{font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--hair);padding:5px 16px;}
  #codewrap{padding:10px 0;overflow-x:auto;}
  .crow{display:flex;padding:0 16px;font-family:var(--mono);font-size:13px;line-height:1.62;white-space:pre;cursor:pointer;transition:background .12s;}
  .crow .ln{display:inline-block;width:4ch;margin-right:14px;text-align:right;color:var(--faint);user-select:none;flex-shrink:0;}
  .crow.blank{cursor:default;}
  .fold{display:block;width:max-content;background:var(--surface-2);border:1px solid var(--hair);color:var(--faint);font-family:var(--mono);font-size:11px;padding:2px 10px;border-radius:5px;margin:6px 16px;}
  .trow.hov,.crow.hov{background:var(--spec-wash);}
  .trow.sel,.crow.sel{background:var(--spec-line);color:#fff;}
  .trow.sel .rid,.crow.sel .ln{color:#fff;}
  #projects{flex:1 1 0;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:12px;}
  #projects[hidden]{display:none;}
  .pcard{background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:14px 18px;cursor:pointer;transition:border-color .12s;}
  .pcard:hover{border-color:var(--spec-line);}
  .pcard .pname{font-weight:600;font-family:var(--mono);}
</style>
</head>
<body>
<main>
  <div id="cols">
    <div id="left">
      <section class="pane" id="projbar"><span class="caret">‹</span><span id="projname"></span></section>
      <section class="pane"><div id="map"></div></section>
    </div>
    <div id="right">
      <section class="pane"><div id="codefile"></div><div id="codewrap"><div id="code"></div></div></section>
    </div>
  </div>
  <div id="projects" hidden></div>
</main>
<script>
(function(){
  function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  var projs=[], proj=null, m=null, lines=[], owner={}, sel=null;

  fetch("projects.json").then(function(r){return r.json();}).then(function(j){
    var all=j.projects||[];
    return Promise.all(all.map(function(p){
      return fetch(p+"/map.json",{method:"HEAD"}).then(function(r){return r.ok?p:null;}).catch(function(){return null;});
    })).then(function(ps){
      projs=ps.filter(Boolean);
      if(projs[0]) open(projs[0]);
      else fail();
    });
  }).catch(fail);
  function fail(){document.getElementById("code").textContent="could not load — serve decompile_v2/ and open /web.html";}

  document.getElementById("projbar").onclick=showProjects;
  document.addEventListener("click",function(e){
    if(!e.target.closest(".trow,.crow,#projbar,#projects")) setSel(null);
  });

  function open(name){
    proj=name; sel=null;
    document.getElementById("projname").textContent=name;
    load();
  }
  function load(){
    fetch(proj+"/map.json").then(function(r){return r.ok?r.json():null;}).then(function(j){
      if(!j){fail();return;}
      m=j;
      return fetch(proj+"/"+m.file).then(function(r){return r.ok?r.text():null;}).then(function(t){
        if(t===null){fail();return;}
        lines=t.replace(/\n$/,"").split("\n");
        buildOwner();
        renderAll();
      });
    }).catch(fail);
  }
  function sections(){return Object.keys(m).filter(function(k){return k!=="file";});}
  function buildOwner(){
    owner={};
    sections().forEach(function(k){
      m[k].forEach(function(t){
        (t.lines||[]).forEach(function(r){
          for(var n=r[0];n<=r[1];n++) owner[n]=t.id;
        });
      });
    });
  }
  function showProjects(){
    document.getElementById("cols").style.display="none";
    var el=document.getElementById("projects");
    el.hidden=false;
    el.innerHTML=projs.map(function(p){return '<div class="pcard"><div class="pname">'+esc(p)+'</div></div>';}).join("");
    Array.prototype.forEach.call(el.querySelectorAll(".pcard"),function(c,i){
      c.onclick=function(){
        el.hidden=true;
        document.getElementById("cols").style.display="";
        open(projs[i]);
      };
    });
  }

  function renderMap(){
    var html="", hidden=0;
    function pill(){if(hidden){html+='<span class="fold">⋯ '+hidden+' hidden</span>';hidden=0;}}
    sections().forEach(function(k){
      var shown=sel?m[k].filter(function(t){return t.id===sel;}):m[k];
      if(!shown.length){hidden+=m[k].length;return;}
      pill();
      html+='<div class="sect">'+esc(k)+'</div>';
      m[k].forEach(function(t){
        if(sel&&t.id!==sel){hidden++;return;}
        pill();
        html+='<div class="trow'+(t.id===sel?" sel":"")+'" data-id="'+t.id+'">'
          +'<span class="rid">'+t.id+'</span><span>'+esc(t.text)+'</span></div>';
      });
    });
    pill();
    document.getElementById("map").innerHTML=html;
  }
  function renderCode(){
    var html="", hidden=0;
    function pill(){if(hidden){html+='<span class="fold">⋯ '+hidden+' lines</span>';hidden=0;}}
    lines.forEach(function(l,i){
      var id=owner[i+1];
      if(sel&&id!==sel){hidden++;return;}
      pill();
      html+='<div class="crow'+(id?(id===sel?" sel":""):" blank")+'"'+(id?' data-id="'+id+'"':'')+'>'
        +'<span class="ln">'+(i+1)+'</span><span>'+(esc(l)||" ")+'</span></div>';
    });
    pill();
    document.getElementById("code").innerHTML=html;
  }
  function wire(){
    Array.prototype.forEach.call(document.querySelectorAll(".trow,.crow"),function(row){
      var id=row.getAttribute("data-id");
      if(!id) return;
      row.onclick=function(e){e.stopPropagation();setSel(id);};
      row.onmouseenter=function(){if(!sel)paint(id);};
      row.onmouseleave=function(){if(!sel)paint(null);};
    });
  }
  function paint(id){
    Array.prototype.forEach.call(document.querySelectorAll(".trow,.crow"),function(row){
      row.classList.toggle("hov",!!id&&row.getAttribute("data-id")===id);
    });
  }
  function setSel(id){
    sel=sel===id?null:id;
    renderAll();
  }
  function renderAll(){
    document.getElementById("codefile").textContent=proj+" / "+m.file+(sel?"  ·  "+sel:"");
    renderMap();
    renderCode();
    wire();
  }
})();
</script>
</body>
</html>
