<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>decompile_claude — explanation reader</title>
<style>
  :root{
    --ground:#eef1f4; --surface:#fff; --surface-2:#f6f8fa; --ink:#151a22; --muted:#59636f;
    --faint:#8b95a1; --hair:#dde3e9; --spec:#0e7c86; --spec-wash:rgba(14,124,134,.11);
    --spec-wash-2:rgba(14,124,134,.05); --spec-line:rgba(14,124,134,.55); --call:#a15c00;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --ground:#0c0e13; --surface:#14181f; --surface-2:#191e27; --ink:#e7ebf1; --muted:#97a1af;
    --faint:#6c7684; --hair:#262d38; --spec:#3fd0dd; --spec-wash:rgba(63,208,221,.13);
    --spec-wash-2:rgba(63,208,221,.06); --spec-line:rgba(63,208,221,.55); --call:#e0a458; }}
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
  main{height:100%;display:flex;justify-content:center;gap:10px;padding:14px;}
  #side{flex:0 0 240px;display:flex;flex-direction:column;gap:10px;min-height:0;}
  #wrap{width:min(720px,100%);display:flex;flex-direction:column;min-height:0;}
  .pane{background:var(--surface);border:1px solid var(--hair);border-radius:10px;overflow:hidden;}
  #projbar{display:flex;align-items:center;gap:9px;padding:8px 14px;font-size:13px;cursor:pointer;flex-shrink:0;}
  .caret{color:var(--faint);font-size:15px;line-height:1;}
  #projname{font-family:var(--mono);color:var(--muted);flex:1;}
  #projlist{flex-shrink:0;}
  #projlist .prow{font-family:var(--mono);font-size:13px;padding:6px 14px;cursor:pointer;}
  #projlist .prow:hover{background:var(--spec-wash);}
  #treewrap{flex:1;min-height:0;display:flex;flex-direction:column;}
  #tree{flex:1;min-height:0;}
  #reader{flex:1;min-height:0;display:flex;flex-direction:column;}
  .phead{font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--hair);padding:5px 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;}
  .rows{flex:1;min-height:0;overflow:auto;padding:6px 0;display:grid;grid-auto-rows:min-content;align-content:start;}
  .bhead{font-family:var(--mono);font-size:11px;color:var(--muted);padding:10px 14px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .12s;}
  .bhead.closable{cursor:pointer;}
  .bhead.closable:hover{color:var(--spec);}
  .pill{font-family:var(--mono);font-size:11px;color:var(--faint);padding:6px 14px;}
  .chunk{font-family:var(--mono);font-size:13px;line-height:1.62;white-space:pre;padding:2px 14px;}
  .anch{color:var(--call);border-bottom:1px dashed var(--call);cursor:pointer;transition:color .12s;}
  .anch:hover{color:var(--spec);border-bottom-color:var(--spec);}
  .anch[data-on]{color:var(--spec);border-bottom-color:var(--spec);}
  .anch.off{color:var(--muted);border-bottom:1px dotted var(--faint);cursor:default;}
  .inopen{margin:12px 0;}
  .inopen .bhead{padding-top:0;}
  .divider{border-top:1px solid var(--hair);margin:7px 14px 3px;}
  #msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;}
  #msg[hidden]{display:none;}
  #readwrap{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;}
</style>
</head>
<body>
<main>
  <div id="side">
    <section class="pane" id="projbar"><span class="caret">‹</span><span id="projname"></span></section>
    <section class="pane" id="projlist" hidden></section>
    <section class="pane" id="treewrap"><div id="tree"></div></section>
  </div>
  <div id="wrap">
    <div id="readwrap">
      <section class="pane" id="reader"><div class="phead" id="head"></div><div class="rows" id="rows"></div></section>
      <div id="msg" hidden></div>
    </div>
  </div>
</main>
<script type="module">
import { FileTree } from "./trees.js";

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
var ANCH=/\[([^\[\]]+)\]\(([^()]+)\)/g;
var projs=[], cur=null, byId={}, blockId={}, tops=[], lines=[], ft=null, stacks={}, openSet={};
var rows=document.getElementById("rows");

function msg(t){var el=document.getElementById("msg");el.hidden=!t;el.textContent=t||"";}

fetch("projects.json",{cache:"no-store"}).then(function(r){return r.json();}).then(function(j){
  return Promise.all((j.projects||[]).map(function(p){
    var names=p.files||(p.file?[p.file]:[]);
    return Promise.all(names.map(function(f){
      return fetch(p.name+"/explanation_"+f+".json",{cache:"no-store"})
        .then(function(r){return r.ok?r.json():null;})
        .then(function(d){
          return fetch(p.name+"/"+f,{cache:"no-store"})
            .then(function(r){return r.ok?r.text():null;})
            .then(function(t){
              if(t===null) return null;
              if(!d||!Array.isArray(d.explanations))
                d={explanations:[],not_covered:{code_lines:[],blank_lines:[]}};
              return {file:f,d:d,code:t};
            });
        })
        .catch(function(){return null;});
    })).then(function(fs){
      fs=fs.filter(Boolean);
      return fs.length?{name:p.name,files:fs}:null;
    });
  }));
}).then(function(ps){
  projs=ps.filter(Boolean);
  if(!projs.length){msg("no explanations — serve decompile_claude/projects/ and run dmap map");return;}
  ft=new FileTree({paths:projs[0].files.map(function(f){return f.file;}),initialExpansion:"open",
    initialSelectedPaths:[projs[0].files[0].file],
    onSelectionChange:function(){
      if(!cur) return;
      var sel=ft.getSelectedPaths()[0];
      if(!sel||sel===cur.file) return;
      var f=null;
      cur.proj.files.forEach(function(x){if(x.file===sel)f=x;});
      if(f) open(cur.proj,f);
    }});
  ft.render({fileTreeContainer:document.getElementById("tree")});
  open(projs[0],projs[0].files[0]);
}).catch(function(){msg("could not load — serve decompile_claude/projects/ and open /web.html");});

document.getElementById("projbar").addEventListener("click",function(){
  var el=document.getElementById("projlist");
  el.innerHTML=projs.map(function(p,i){return '<div class="prow" data-i="'+i+'">'+esc(p.name)+'</div>';}).join("");
  el.hidden=!el.hidden;
});
document.getElementById("projlist").addEventListener("click",function(e){
  var row=e.target.closest(".prow");
  if(!row) return;
  document.getElementById("projlist").hidden=true;
  var p=projs[+row.getAttribute("data-i")];
  if(!cur||p!==cur.proj){
    ft.resetPaths(p.files.map(function(f){return f.file;}));
    open(p,p.files[0]);
    ft.selectPath(p.files[0].file);
  }
});

function open(p,f){
  cur={proj:p,name:p.name,file:f.file,d:f.d,code:f.code};
  document.getElementById("projname").textContent=p.name;
  lines=f.code?f.code.replace(/\n$/,"").split("\n"):[];
  byId={}; blockId={}; stacks={}; openSet={};
  f.d.explanations.forEach(function(e){
    byId[e.id]=e;
    if(!(e.block in blockId)) blockId[e.block]=e.id;
  });
  var refd={};
  f.d.explanations.forEach(function(e){
    (e.anchors||[]).forEach(function(a){
      var t=targetOf(a);
      if(t&&t!==e.id) refd[t]=1;
    });
  });
  tops=f.d.explanations.filter(function(e){return !refd[e.id];});
  tops.forEach(function(e){stacks[e.id]=[e.id];});
  msg("");
  render();
}

function targetOf(a){
  if(a.explanation) return byId[a.explanation]?a.explanation:null;
  var t=blockId[a.block];
  return t===undefined?null:t;
}

function anchorByWords(e,w){
  var found=null;
  (e.anchors||[]).forEach(function(a){if(a.words===w)found=a;});
  return found;
}

function startOf(e){return Math.min.apply(null,e.block_lines.map(function(r){return r[0];}));}
function endOf(e){return Math.max.apply(null,e.block_lines.map(function(r){return r[1];}));}

function fmtSpans(e){
  return e.block_lines.map(function(r){return r[0]===r[1]?String(r[0]):r[0]+"–"+r[1];}).join(", ");
}

function nonBlank(a,b){
  if(!lines.length) return b-a+1;
  var k=0;
  for(var n=a;n<=b&&n<=lines.length;n++) if(lines[n-1]&&lines[n-1].trim()) k++;
  return k;
}

function lineHtml(e,l,opens){
  var out="", last=0, m;
  ANCH.lastIndex=0;
  while((m=ANCH.exec(l))){
    out+=esc(l.slice(last,m.index));
    var w=m[1].trim(), a=anchorByWords(e,w), t=a?targetOf(a):null;
    if(t&&t!==e.id){
      var kind=a.explanation?"swap":"zoom";
      var on=kind==="zoom"&&openSet[t];
      out+='<span class="anch" data-kind="'+kind+'" data-child="'+t+'"'+(on?' data-on="1"':'')+'>'+esc(m[1])+'</span>';
      if(on) opens.push(t);
    }else{
      out+='<span class="anch off">'+esc(m[1])+'</span>';
    }
    last=m.index+m[0].length;
  }
  out+=esc(l.slice(last));
  return out;
}

function textHtml(e){
  var out="", buf=[];
  function flush(){
    if(buf.length){out+='<div class="chunk">'+buf.join("\n")+'</div>';buf=[];}
  }
  e.text.split("\n").forEach(function(l){
    var opens=[];
    buf.push(lineHtml(e,l,opens));
    if(opens.length){
      flush();
      opens.forEach(function(t){out+=expansionHtml(byId[t]);});
    }
  });
  flush();
  return out;
}

function expansionHtml(e){
  return '<div class="inopen">'
    +'<div class="bhead closable" data-close="'+e.id+'">'+esc(e.block)+' · '+fmtSpans(e)+'</div>'
    +textHtml(e)
    +'</div>';
}

function render(){
  var shown=tops.slice().sort(function(a,b){return startOf(a)-startOf(b);}), html="", pos=1, opened=0;
  shown.forEach(function(top,i){
    var st=stacks[top.id], e=byId[st[st.length-1]];
    var a=startOf(top);
    if(a>pos&&nonBlank(pos,a-1)) html+='<div class="pill">▹ '+nonBlank(pos,a-1)+' hidden lines</div>';
    html+='<div data-top="'+top.id+'">'
      +'<div class="bhead'+(st.length>1?' closable':'')+'" data-pop="'+top.id+'">'
      +esc(e.block)+' · '+fmtSpans(e)+'</div>'
      +textHtml(e)+'</div>';
    if(i<shown.length-1) html+='<div class="divider"></div>';
    pos=Math.max(pos,endOf(top)+1);
    opened+=st.length;
  });
  if(lines.length&&pos<=lines.length&&nonBlank(pos,lines.length))
    html+='<div class="pill">▹ '+nonBlank(pos,lines.length)+' hidden lines</div>';
  rows.innerHTML=html;
  var count=opened+Object.keys(openSet).length;
  document.getElementById("head").textContent=
    cur.name+"/"+cur.file+"  ·  "+count+"/"+cur.d.explanations.length+" explanations";
}

function closeTree(id){
  delete openSet[id];
  (byId[id].anchors||[]).forEach(function(a){
    var t=targetOf(a);
    if(t&&openSet[t]) closeTree(t);
  });
}

rows.addEventListener("click",function(ev){
  var an=ev.target.closest(".anch[data-child]");
  if(an){
    var t=+an.getAttribute("data-child");
    if(an.getAttribute("data-kind")==="swap"&&!an.closest(".inopen")){
      var topEl=an.closest("[data-top]");
      var st=stacks[+topEl.getAttribute("data-top")];
      if(st.indexOf(t)===-1) st.push(t);
      render();
      return;
    }
    if(openSet[t]) closeTree(t);
    else openSet[t]=1;
    render();
    return;
  }
  var cl=ev.target.closest(".bhead[data-close]");
  if(cl){
    closeTree(+cl.getAttribute("data-close"));
    render();
    return;
  }
  var pp=ev.target.closest(".bhead.closable[data-pop]");
  if(pp){
    var st=stacks[+pp.getAttribute("data-pop")];
    closeTree(st.pop());
    render();
  }
});
</script>
</body>
</html>
