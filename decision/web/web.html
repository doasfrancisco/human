<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Decisions &amp; Code</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }
#left, #right { width: 50%; height: 100%; overflow-y: auto; padding: 16px; }
#left { border-right: 1px solid #ccc; }
.decision { padding: 8px 10px; margin-bottom: 8px; border-radius: 4px; cursor: pointer; border: 1px solid #ccc; }
.decision.compiler { background-color: #cc7722; color: #fff; border-color: #a05c10; }
.decision.human { background-color: #f5f5f5; }
.decision.active { outline: 3px solid #333; }
.code-line { font-family: monospace; padding: 4px 8px; margin-bottom: 4px; border-radius: 3px; white-space: pre; border: 1px solid transparent; }
.code-line.highlighted { background-color: #ffe08a; border-color: #e0b030; }
.decision-id { font-size: 0.75em; opacity: 0.7; margin-right: 6px; }
</style>
</head>
<body>
<div id="left"><h2 style="margin-bottom:12px">Decisions</h2></div>
<div id="right"><h2 style="margin-bottom:12px">Code</h2></div>
<script>
Promise.all([fetch('decisions.json').then(r => r.json()), fetch('code.json').then(r => r.json())])
.then(([decisionsData, codeData]) => {
  const decisions = decisionsData.decisions;
  const codeLines = codeData.code;
  const left = document.getElementById('left');
  const right = document.getElementById('right');
  let activeId = null;
  codeLines.forEach(line => {
    const div = document.createElement('div');
    div.className = 'code-line';
    div.dataset.source = JSON.stringify(line.source || []);
    div.textContent = line.text;
    right.appendChild(div);
  });
  decisions.forEach(dec => {
    const div = document.createElement('div');
    const isCompiler = dec.by === 'compiler';
    div.className = 'decision ' + (isCompiler ? 'compiler' : 'human');
    div.innerHTML = '<span class="decision-id">' + dec.id + '</span>' + dec.text;
    div.addEventListener('click', () => {
      document.querySelectorAll('.decision.active').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.code-line.highlighted').forEach(el => el.classList.remove('highlighted'));
      if (activeId === dec.id) { activeId = null; return; }
      activeId = dec.id;
      div.classList.add('active');
      document.querySelectorAll('.code-line').forEach(cl => {
        const src = JSON.parse(cl.dataset.source);
        if (src.includes(dec.id)) cl.classList.add('highlighted');
      });
    });
    left.appendChild(div);
  });
})
.catch(err => { document.body.innerHTML = '<pre style="color:red">' + err + '</pre>'; });
</script>
</body>
</html>
