<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Reader</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: monospace; font-size: 14px; background: #f5f5f5; color: #111; min-height: 100vh; }
#view-list { display: block; padding: 24px; }
#view-detail { display: none; flex-direction: column; height: 100vh; }
#detail-header { padding: 8px 16px; border-bottom: 1px solid #ccc; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
#back-btn { cursor: pointer; padding: 4px 10px; border: 1px solid #999; background: #eee; border-radius: 4px; font: inherit; }
#detail-columns { display: flex; flex: 1; overflow: hidden; }
#col-ideas { flex: 1; overflow-y: auto; border-right: 1px solid #ccc; padding: 8px 0; }
#col-code { flex: 1; overflow-y: auto; padding: 8px 0; }
.project-card { display: inline-block; margin: 8px; padding: 16px 24px; border: 1px solid #bbb; border-radius: 6px; background: #fff; cursor: pointer; user-select: none; }
.project-card:hover { background: #e8e8e8; }
.idea-row, .code-row { display: flex; gap: 10px; padding: 3px 12px; cursor: pointer; user-select: none; white-space: pre-wrap; word-break: break-word; }
.idea-row:hover, .code-row:hover { outline: 1px solid #aaa; }
.row-id { color: #888; flex-shrink: 0; min-width: 3em; }
.row-linenum { color: #888; flex-shrink: 0; min-width: 2.5em; text-align: right; }
.row-text { flex: 1; }
.placeholder-row { padding: 3px 12px; color: #999; font-style: italic; }
.node-selected { background: #5b9bd5 !important; color: #fff !important; }
.node-selected .row-id, .node-selected .row-linenum, .node-selected .row-text { color: #fff !important; }
.node-flow { background: #c8dff5 !important; }
.node-hover { background: #d6ead6 !important; }
@media (prefers-color-scheme: dark) {
  body { background: #1a1a1a; color: #e8e8e8; }
  .project-card { background: #2a2a2a; border-color: #555; color: #e8e8e8; }
  .project-card:hover { background: #3a3a3a; }
  #detail-header { border-color: #444; }
  #back-btn { background: #2a2a2a; border-color: #666; color: #e8e8e8; }
  #col-ideas { border-color: #444; }
  .row-id, .row-linenum { color: #aaa; }
  .node-selected { background: #2a6cb5 !important; color: #fff !important; }
  .node-flow { background: #1a3a5c !important; color: #cce !important; }
  .node-hover { background: #1a3a2a !important; color: #cec !important; }
  .node-flow .row-id, .node-flow .row-linenum, .node-flow .row-text { color: #cce !important; }
  .node-hover .row-id, .node-hover .row-linenum, .node-hover .row-text { color: #cec !important; }
}
</style>
</head>
<body>
<div id="view-list">
  <h2 style="margin-bottom:16px;">Projects</h2>
  <div id="cards-container"></div>
</div>
<div id="view-detail">
  <div id="detail-header">
    <button id="back-btn">&#8592; Back</button>
    <span id="project-title" style="font-weight:bold;"></span>
  </div>
  <div id="detail-columns">
    <div id="col-ideas"></div>
    <div id="col-code"></div>
  </div>
</div>
<script>
(function() {
  const viewList = document.getElementById('view-list');
  const viewDetail = document.getElementById('view-detail');
  const cardsContainer = document.getElementById('cards-container');
  const colIdeas = document.getElementById('col-ideas');
  const colCode = document.getElementById('col-code');
  const backBtn = document.getElementById('back-btn');
  const projectTitle = document.getElementById('project-title');
  let selectedId = null;
  let allIdeaRows = [];
  let allCodeRows = [];
  let sourceMap = {};
  let reverseMap = {};
  let ideaRowEls = {};
  let codeRowEls = {};
  async function init() {
    try {
      const resp = await fetch('./projects.json');
      const data = await resp.json();
      renderProjectList(data.projects);
    } catch(e) {
      cardsContainer.textContent = 'Could not load projects.json: ' + e;
    }
  }
  function renderProjectList(projects) {
    cardsContainer.innerHTML = '';
    projects.forEach(function(name) {
      const card = document.createElement('div');
      card.className = 'project-card';
      card.textContent = name;
      card.addEventListener('click', function() { openProject(name); });
      cardsContainer.appendChild(card);
    });
  }
  async function openProject(name) {
    try {
      const [ideasResp, codeResp] = await Promise.all([
        fetch('./' + name + '/ideas.json'),
        fetch('./' + name + '/code.json')
      ]);
      const ideasData = await ideasResp.json();
      const codeData = await codeResp.json();
      buildMaps(ideasData.ideas, codeData.code);
      projectTitle.textContent = name;
      renderDetail(ideasData.ideas, codeData.code);
      showView('detail');
    } catch(e) {
      alert('Could not load project ' + name + ': ' + e);
    }
  }
  function showView(which) {
    clearSelection();
    if (which === 'list') {
      viewList.style.display = 'block';
      viewDetail.style.display = 'none';
    } else {
      viewList.style.display = 'none';
      viewDetail.style.display = 'flex';
    }
  }
  function buildMaps(ideas, codeLines) {
    sourceMap = {};
    reverseMap = {};
    const allNodes = ideas.concat(codeLines);
    allNodes.forEach(function(node) {
      const id = String(node.id);
      sourceMap[id] = (node.source || []).map(String);
      if (!reverseMap[id]) reverseMap[id] = [];
    });
    allNodes.forEach(function(node) {
      const id = String(node.id);
      (sourceMap[id] || []).forEach(function(srcId) {
        if (!reverseMap[srcId]) reverseMap[srcId] = [];
        reverseMap[srcId].push(id);
      });
    });
  }
  function getAncestors(nodeId) {
    const visited = new Set();
    const stack = [nodeId];
    while (stack.length) {
      const cur = stack.pop();
      if (visited.has(cur)) continue;
      visited.add(cur);
      (sourceMap[cur] || []).forEach(function(srcId) {
        if (srcId !== 'I0' && !visited.has(srcId)) stack.push(srcId);
      });
    }
    visited.delete(nodeId);
    return visited;
  }
  function getDescendants(nodeId) {
    const visited = new Set();
    const stack = [nodeId];
    while (stack.length) {
      const cur = stack.pop();
      if (visited.has(cur)) continue;
      visited.add(cur);
      (reverseMap[cur] || []).forEach(function(childId) {
        if (!visited.has(childId)) stack.push(childId);
      });
    }
    visited.delete(nodeId);
    return visited;
  }
  function computeFlow(nodeId) {
    const ancestors = getAncestors(nodeId);
    const descendants = getDescendants(nodeId);
    const flow = new Set([nodeId]);
    ancestors.forEach(function(id) { flow.add(id); });
    descendants.forEach(function(id) { flow.add(id); });
    return flow;
  }
  function renderDetail(ideas, codeLines) {
    colIdeas.innerHTML = '';
    colCode.innerHTML = '';
    ideaRowEls = {};
    codeRowEls = {};
    allIdeaRows = [];
    allCodeRows = [];
    ideas.forEach(function(idea) {
      if (String(idea.id) === 'I0') return;
      const row = document.createElement('div');
      row.className = 'idea-row';
      row.dataset.id = String(idea.id);
      const idSpan = document.createElement('span');
      idSpan.className = 'row-id';
      idSpan.textContent = idea.id;
      const textSpan = document.createElement('span');
      textSpan.className = 'row-text';
      textSpan.textContent = idea.text;
      row.appendChild(idSpan);
      row.appendChild(textSpan);
      attachRowListeners(row, String(idea.id));
      colIdeas.appendChild(row);
      allIdeaRows.push(row);
      ideaRowEls[String(idea.id)] = row;
    });
    codeLines.forEach(function(line, index) {
      const row = document.createElement('div');
      row.className = 'code-row';
      row.dataset.id = String(line.id);
      const numSpan = document.createElement('span');
      numSpan.className = 'row-linenum';
      numSpan.textContent = index + 1;
      const textSpan = document.createElement('span');
      textSpan.className = 'row-text';
      textSpan.textContent = line.text;
      row.appendChild(numSpan);
      row.appendChild(textSpan);
      attachRowListeners(row, String(line.id));
      colCode.appendChild(row);
      allCodeRows.push(row);
      codeRowEls[String(line.id)] = row;
    });
  }
  function attachRowListeners(row, id) {
    row.addEventListener('click', function(e) {
      e.stopPropagation();
      handleNodeClick(id);
    });
    row.addEventListener('mouseover', function(e) {
      e.stopPropagation();
      if (selectedId !== null) return;
      applyHoverHighlight(id);
    });
    row.addEventListener('mouseout', function(e) {
      if (selectedId !== null) return;
      clearHoverHighlight();
    });
  }
  function handleNodeClick(id) {
    if (selectedId === id) {
      clearSelection();
      return;
    }
    clearSelection();
    selectedId = id;
    const flow = computeFlow(id);
    applySelectionHighlight(id, flow);
    collapseOutsideFlow(flow);
  }
  function applySelectionHighlight(nodeId, flow) {
    const allRows = allIdeaRows.concat(allCodeRows);
    allRows.forEach(function(row) {
      const rid = row.dataset.id;
      if (rid === nodeId) {
        row.classList.add('node-selected');
      } else if (flow.has(rid)) {
        row.classList.add('node-flow');
      }
    });
  }
  function applyHoverHighlight(nodeId) {
    clearHoverHighlight();
    const flow = computeFlow(nodeId);
    const allRows = allIdeaRows.concat(allCodeRows);
    allRows.forEach(function(row) {
      if (flow.has(row.dataset.id) || row.dataset.id === nodeId) {
        row.classList.add('node-hover');
      }
    });
  }
  function clearHoverHighlight() {
    const allRows = allIdeaRows.concat(allCodeRows);
    allRows.forEach(function(row) { row.classList.remove('node-hover'); });
  }
  function collapseOutsideFlow(flow) {
    collapseColumn(colIdeas, allIdeaRows, flow);
    collapseColumn(colCode, allCodeRows, flow);
  }
  function collapseColumn(colEl, rows, flow) {
    let hiddenRun = [];
    function flushRun() {
      if (hiddenRun.length === 0) return;
      const placeholder = document.createElement('div');
      placeholder.className = 'placeholder-row';
      placeholder.textContent = '... (' + hiddenRun.length + ' hidden)';
      placeholder.dataset.placeholder = 'true';
      colEl.insertBefore(placeholder, hiddenRun[0]);
      hiddenRun.forEach(function(r) { colEl.removeChild(r); });
      hiddenRun = [];
    }
    rows.forEach(function(row) {
      if (flow.has(row.dataset.id)) {
        flushRun();
      } else {
        hiddenRun.push(row);
      }
    });
    flushRun();
  }
  function restoreColumn(colEl, rows) {
    const placeholders = Array.from(colEl.querySelectorAll('[data-placeholder]'));
    placeholders.forEach(function(p) { colEl.removeChild(p); });
    rows.forEach(function(row) {
      if (!colEl.contains(row)) colEl.appendChild(row);
    });
    const allRowsInCol = Array.from(colEl.querySelectorAll('.idea-row, .code-row'));
    const rowSet = new Set(rows);
    rows.forEach(function(row, i) {
      colEl.appendChild(row);
    });
  }
  function clearSelection() {
    if (selectedId === null) return;
    selectedId = null;
    const allRows = allIdeaRows.concat(allCodeRows);
    allRows.forEach(function(row) {
      row.classList.remove('node-selected', 'node-flow', 'node-hover');
    });
    restoreColumn(colIdeas, allIdeaRows);
    restoreColumn(colCode, allCodeRows);
  }
  document.addEventListener('click', function(e) {
    if (!e.target.closest('.idea-row, .code-row')) {
      clearSelection();
    }
  });
  backBtn.addEventListener('click', function() { showView('list'); });
  init();
})();
</script>
</body>
</html>
